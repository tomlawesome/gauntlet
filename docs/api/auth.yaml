openapi: 3.1.0
info:
  title: gauntlet gate HTTP API
  # Always the VERSION file's value; the release merge request bumps
  # both, and gate/contracttest fails if they differ.
  version: 0.4.2
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    Every route `gate.Routes` serves: `/api/auth/*` and `/api/tokens[/{id}]`.
    This document is the source of truth both frontends build from
    (docs/adr/0002-api-standards-and-compatibility.md). The contract tests
    in `gate/contracttest` drive every route through it, and fail when
    a handler and this document disagree or when a route exists on one
    side only.

    **Mounting.** An application mounts `Routes` under `gate.Protect`, so
    the responses below include the ones `Protect` itself writes before a
    handler runs:

    - `503` class `setup-required` on every route except `GET
      /api/auth/session` and `POST /api/auth/register` while no account
      exists yet. The SSO routes are not exempt: the first account is
      never an SSO one.
    - `403` class `csrf-required` on every `POST`, `PUT`, `PATCH` and `DELETE`
      without the `X-Requested-With` header carrying the application's
      configured value.
    - `401` class `sign-in-required` on every route that needs a session
      and has none. Exempt from that: session, register, login,
      login/factor, login/factor/begin, login/passkey/begin,
      login/passkey, login/confirm, login/prove/begin, login/prove,
      login/escape, reauthenticate, logout, unlock and the two
      `GET /api/auth/oidc/*` routes.
    - `403` class `forbidden` on a session-gated route when the account's
      role is not one gauntlet knows, or, on the admin routes, when the
      caller is not an admin; class `must-change-password`,
      `must-enrol-factor` or `must-enrol-passkey` when the session is
      stopped at one of the three doors (see the `X-Auth-Gate` header).

    A request carrying an `Authorization` header never reaches these
    routes once an account exists: `Protect` sends a valid `Bearer` token
    to the application's own handler for that token kind, and answers any
    other value `401` class `invalid-credentials` "invalid or revoked
    token".

    **Session cookie.** Its name is the application's `Config.CookieName`,
    prefixed `__Host-` while `Config.SecureCookie` is true; it is
    `HttpOnly`, `SameSite=Lax`, `Secure` while `Config.SecureCookie` is
    true, path `/`. Routes marked "sets the session cookie" issue a fresh
    one, and a login ends the same account's session the browser already
    held; logout clears it. Its `Max-Age` is
    normally the session store's lifetime ceiling (the longest a session
    may last from its sign-in). Two routes continue the sign-in the
    browser already had instead of starting a new one:
    `POST /api/auth/reauthenticate` and `POST /api/auth/logout-all`. Their
    new session keeps the original sign-in time, so its cookie ends at
    that sign-in's ceiling, not a fresh one.

    **Known-browser cookie.** Every route that sets the session cookie,
    except `reauthenticate`, also sets `gate_known_browser` (#44), unless
    saving it fails, when the browser keeps the value it had. It is
    `HttpOnly`, `SameSite=Lax`, `Secure` while `Config.SecureCookie` is
    true, path `/api/auth` (every route that sets the session cookie is
    under it, so each one replaces the browser's value instead of adding
    another; the routes that read it for the allowance below are `login`,
    `login/factor`, `login/confirm`, `login/prove`, `login/escape`,
    `login/passkey` and `reauthenticate`, and `login/factor/begin` and
    `login/prove/begin` read it only for the ban and lockout exceptions
    and the remembered browsers' own begin limit (see
    `login/factor/begin`)),
    no `__Host-` prefix (that needs path `/`),
    `Max-Age` 45 days. Its value is up to four tokens joined by `.`,
    one per account the browser has signed in to, most recent first
    (#55); each is 32 random bytes, base64url, and names nothing. An
    account's record holds only its own tokens' SHA-256, and a fresh
    token replaces that account's one at every sign-in. While the account
    is locked out, or the client's address is at its limit, a browser
    carrying a value the named account remembers still gets through on
    one small allowance that all of that account's remembered browsers
    share (the limiter's attempts per window), separate from the ordinary
    limits; any other browser gets `429`.
    A request carrying such a value is also not refused by the address
    ban (#70: 100 failed sign-ins from one address (an IPv6 address
    counts by its /64) in a day ban it for 24 hours, answered with the
    same `429`).
    It never signs anyone in by itself, is refused while the account's
    sign-in is disabled, and every failure through it counts toward the
    disable. An account remembers at most three browsers, each for 45
    days from its latest sign-in there; sign out everywhere (for an
    account with a local password), an admin's password reset and an
    admin's sign-out forget them all. A frontend does nothing with
    it: the browser keeps and sends it.

    **Errors.** Every error body is RFC 9457 Problem Details
    (`application/problem+json`, gauntlet #23): `type`, a permanent link
    into [`docs/api/errors.md`](errors.md) naming a fixed `title` and
    `status`; `detail`, free text that may change wording and is never
    parsed; and, on the three responses marked below, an extension member
    (`username` on a user delete's `500`; `unknownCredential` on the `401`
    of `login/passkey` and `reauthenticate`) that is part of the contract
    and does not change. (`totpActive`, the other extension member, was last
    sent by 0.2.0's `totp/confirm`; see `PartiallyCompletedProblem`.) A frontend branches on `type` (or the status code and
    the `X-Auth-Gate` header, for the three forced-auth-gate classes),
    never on `detail`'s text. An unmatched path or method (a typo, or a
    method the route does not take), once past `Protect`'s own checks
    above, answers the same shape with `type:
    about:blank` and no `detail` -- not a documented class, and the one
    response this document cannot enumerate per-route; the `Allow` header
    on a `405` lists the methods the path does take.

    **Compatibility.** Additive only within a major version: routes,
    response fields and status codes are added, never renamed or removed
    (ADR-0002). JSON response bodies are closed (`additionalProperties:
    false`) so the contract tests notice a field the handler added without
    this document, and a field it dropped or renamed. The one deliberate
    exception is WebAuthn's own JSON (the passkey routes): the options
    `register/begin`, `login/factor/begin` and the other begin routes
    answer, and the `credential`, `assertion` and `adminAssertion`
    request fields, are the W3C's `PublicKeyCredential` shapes, produced and consumed by the WebAuthn library and the browser,
    not by a frontend's own code. They are open objects here so a library
    update that adds a W3C field cannot fail the contract.

    **Passkeys.** The passkey routes are always served. When the
    application wires no passkeys (`Deps.Passkeys` nil) every one of them
    answers `404`, `login/factor` answers `404` to an `assertion`, the
    session body has no `passkeys` and `login` never offers `passkey`.
    While the application's relying party is not ready (no usable public
    URL), every passkey begin route, `register/finish` and the assertion step
    answer `409` naming the reason; list, rename and delete keep working.

    **Signing in with a passkey alone** (#77). When the application turns
    it on (`Config.PasskeySignIn`, off by default) and its relying party
    can do it, `POST /api/auth/login/passkey/begin` and `POST
    /api/auth/login/passkey` sign in with a passkey that verified the user
    -- a PIN or a biometric at the authenticator, neither of which reaches
    the server -- and no password. The browser offers its own passkeys (no
    username is typed; the options allow none), and the passkey names its
    account through its user handle. While it is off, or the application
    has no passkeys, both routes and an `assertion` sent to
    `POST /api/auth/reauthenticate` answer `404`, and the session body's
    `passkeys` block does not say `signIn`. Every account keeps its
    password: a passkey replaces it at sign-in, never in the account. The
    sign-in is judged for unusual-sign-in signals like any other (method
    `passkey_alone`), counts toward the account's lockout, the address
    limit and ban like a password attempt, and meets the same doors after
    it (a forced password change still holds).

    **Every admin holds a passkey** (#82). When the application requires
    it (`Config.AdminPasskey`; it must say either way), an admin account
    holding no passkey usable at this address is stopped at the
    `must-enrol-passkey` door until it registers one (an authenticator app
    does not open it; an admin with no local password meets
    `must-change-password` first). The session body says so
    (`mustEnrolPasskey`, `adminPasskeyRequired`), as do the role, create
    and list routes (`heldForPasskey`). An admin cannot delete their own
    last usable passkey (`409`). The step-up routes take a passkey in
    place of a code, through `POST /api/auth/step-up/passkey/begin`.

    **First second factor: hold until confirmed** (#58). An account's
    first second factor -- its first passkey (`register/finish`) or its
    first authenticator app (`totp/confirm`) -- is saved together with
    ten new recovery codes, in one write, on hold. The response carries
    the codes once and `pendingConfirmation: true`. Nothing is live yet:
    the factor signs nothing in, is not listed or counted, the codes
    redeem nothing, the must-enrol-factor door still holds, and no
    session is ended. `POST /api/auth/recovery-codes/confirm` ("I've
    saved these") makes both live, ends the account's other sessions,
    sets a fresh session cookie and audits the factor. Unconfirmed after
    ten minutes, the factor and its codes are deleted. While one is on
    hold, starting another enrolment answers `409`. A later factor, on
    an account that already has one, is added live at once without codes
    (`alreadyIssued: true`): an account keeps one set of recovery codes.

security:
  - sessionCookie: []

paths:
  /api/auth/session:
    get:
      operationId: getSession
      summary: Report sign-in state
      description: |
        Always answers 200: it reports state, it does not gate access. A
        frontend calls it on load to choose between first-run registration,
        the login form and the signed-in app. Reachable with no session and
        while no account exists.
      security:
        - {}
        - sessionCookie: []
      responses:
        "200":
          description: The caller's state. `username`, `role`, `adminPasskeyRequired` and `signedInSince` are present only while `authenticated` is true; the account booleans are always sent, false while signed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"

  /api/auth/register:
    post:
      operationId: register
      summary: Create the first account
      description: |
        Creates the first (and only self-service) account, always as admin,
        and sets the session cookie. Needs the one-time setup code the
        server wrote to its log when it started with no accounts (#37):
        a wrong or missing code is `401`, counted against the client
        address by the login limiter (`429` at the limit), and nothing is
        created. The code is typed with or without its dashes, in either
        case. Refused once any account exists. Reachable while no account
        exists; still needs the CSRF header. The password is checked as
        every new password is (see `changePassword`); a refused one is
        `400`, with the reason.
      security:
        - {}
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupCredentials"
      responses:
        "201":
          description: Account created and signed in; sets the session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/CSRFRequired"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/NotPersisted"

  /api/auth/login:
    post:
      operationId: login
      summary: Sign in with username and password
      description: |
        Rate-limited per client address and per account; only a right
        password, or a server error, hands the attempt back. A password
        reset clears the account's own count, not the address's (#86).
        A browser the account remembers (the known-browser cookie) shares
        the account's known-browser allowance past either limit (#44).
        On an account with no second factor this
        signs in and sets the session cookie. On an account holding one it
        does not: it sets a short-lived pending-login cookie and names the
        factors to ask for next, and `POST /api/auth/login/factor` finishes
        the sign-in. `passkey` is listed (first, with `passkeyOrigin`) when
        the relying party is ready and the account holds a passkey
        registered for it. The `secondFactor` list can be empty (an account
        whose only passkeys are stale, or an application without
        passkeys): a recovery code still completes it.

        A sign-in that completes here (no second factor) is first judged
        for unusual-sign-in signals (#55); under the application's policy
        it may be refused (`403` `sign-in-refused`), or held for a
        confirmation code the application delivers (`200`
        `{"confirm": true}`, the confirm cookie set and no session
        cookie; `POST /api/auth/login/confirm` finishes it). The response
        never says which signal was raised or where a code went. Codes
        sent are limited per account (#84, #83): a second code waits 30
        seconds after the first, each further one in the hour twice as
        long, and no more than five go out in an hour. Past the limit a
        sign-in that would be held is answered `429` `rate-limited`
        instead, with no code and no cookie. The second-factor and
        passkey steps do the same.

        A `403` `sign-in-refused` for an admin whom no other admin can act
        for may also set the escape cookie (#66): the code that lets that
        one attempt through is in the server's log (or handed to the
        application's `Config.OnEscapeCode`), not in any response, and
        `POST /api/auth/login/escape` redeems it. The `403` body is the
        same either way. A sign-in held for such an admin (`200`
        `confirm` here; `confirm` or `prove` at `login/factor`; `confirm`
        at `login/passkey`) sets the cookie too, so a lost passkey or an
        undelivered code has the same way out.
      security:
        - {}
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Signed in, a second factor is needed, or a confirmation code was sent (#55; sets the confirm cookie, no session cookie).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Account"
                  - $ref: "#/components/schemas/SecondFactorChallenge"
                  - $ref: "#/components/schemas/ConfirmationChallenge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/CSRFRequiredOrSignInRefused"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/login/factor:
    post:
      operationId: loginFactor
      summary: Finish a sign-in with a second factor
      description: |
        Completes a login `POST /api/auth/login` stopped short of a
        session, using the pending-login cookie it set. `code` is a current
        authenticator-app code or one unused recovery code (spent on use).
        `assertion` is the browser's answer to the options
        `POST /api/auth/login/factor/begin` gave, checked against the
        passkey ceremony cookie that route set. Shares the login rate
        limit; begin's own count is separate and is not handed back here. Sets the session cookie on success. Like `login`, the
        completed sign-in is first judged for unusual-sign-in signals and
        may be refused (`403` `sign-in-refused`), held for a confirmation
        code (`200` `{"confirm": true}`, #55) or, when the account holds a
        passkey usable at this address and the application's policy asks
        for one, held for a passkey (`200` `{"prove": "passkey",
        "passkeyOrigin": ...}`, #65; `POST /api/auth/login/prove/begin`
        and `POST /api/auth/login/prove` finish it). A passkey assertion
        sent here is already a passkey sign-in and is never held for
        another. Both `code` and `assertion`, or neither (a `null`
        assertion counts as none), is `400` class `invalid-request`, before
        anything is counted; the pending login still holds.
      security:
        - pendingLoginCookie: []
        - pendingLoginCookie: []
          passkeyAssertCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginFactorRequest"
      responses:
        "200":
          description: Signed in (sets the session cookie), a confirmation code was sent (#55), or a passkey is owed (#65); either sets the confirm cookie and no session cookie.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Account"
                  - $ref: "#/components/schemas/ConfirmationChallenge"
                  - $ref: "#/components/schemas/ProveChallenge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The code or passkey assertion was wrong (`invalid-credentials`); or the pending login is invalid, expired, already completed, or its account is gone or has lost its second factor (`step-expired`) -- sign in again from the start; or the passkey ceremony `login/factor/begin` started is missing, invalid, expired or already used (`step-expired`, its cookie cleared) -- call `login/factor/begin` again, the pending login still holds.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                const: Bearer realm="gate"
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - properties:
                      type:
                        enum:
                          - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#invalid-credentials
                          - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#step-expired
        "403":
          $ref: "#/components/responses/CSRFRequiredOrSignInRefused"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/login/confirm:
    post:
      operationId: loginConfirm
      summary: Finish a sign-in with a confirmation code
      description: |
        Completes a sign-in the unusual-sign-in policy held for a
        confirmation code (#55): `login`, `login/factor`, `login/passkey`
        or the SSO callback set the confirm cookie and the application
        delivered the code to the person. `code` is the eight digits, with or without
        the dash, surrounding whitespace ignored. Shares the login rate
        limit; a wrong code counts as a failed second factor. The ticket
        is used by exactly one sign-in and lives 15 minutes. Sets the
        session cookie on success and clears the confirm cookie. A ticket
        that is held for a passkey (#65) is not a code ticket: it is
        refused here as `step-expired`, as a code ticket is at
        `login/prove`.
      security:
        - confirmLoginCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmCodeRequest"
      responses:
        "200":
          description: Signed in; sets the session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The code was wrong (`invalid-credentials`), or the confirm cookie is missing, invalid, expired or already used, or its account is gone (`step-expired`; the cookie is cleared) -- sign in again from the start.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                const: Bearer realm="gate"
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - properties:
                      type:
                        enum:
                          - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#invalid-credentials
                          - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#step-expired
        "403":
          $ref: "#/components/responses/CSRFRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/login/prove/begin:
    post:
      operationId: loginProveBegin
      summary: Start the passkey a held sign-in owes
      description: |
        Answers the W3C request options for `navigator.credentials.get()`
        for a sign-in the unusual-sign-in policy held for a passkey (#65,
        ADR-0009): the account's own passkeys registered for the current
        relying party, user verification preferred (possession of the key
        is the point, so a security key without a PIN qualifies). Reached
        with the confirm cookie `login/factor` or the SSO callback set and
        no session; takes no body. Sets the passkey ceremony cookie (sealed, path
        `/api/auth/login`, five minutes; each challenge is usable once).
        It takes nothing on the login limit: `login/prove` is what is
        counted. Each begin is counted on the account's passkey-step begin
        budget, as `login/factor/begin`'s are (#80), and a locked or
        disabled account or a banned address is refused before any
        challenge, with `login/factor/begin`'s known-browser exceptions:
        `429` either way. `404` when the application has no passkeys;
        `409` while the relying party is not ready or the account has no
        passkey usable here (one removed since the sign-in was held).
      security:
        - confirmLoginCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200":
          description: The request options; sets the passkey ceremony cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialAssertion"
        "401":
          description: The confirm cookie is missing, invalid, expired or already used, is not one held for a passkey, or its account is gone (`step-expired`; the cookie is cleared) -- sign in again from the start.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                const: Bearer realm="gate"
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - properties:
                      type:
                        enum:
                          - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#step-expired
        "403":
          $ref: "#/components/responses/CSRFRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/login/prove:
    post:
      operationId: loginProve
      summary: Finish a held sign-in with a passkey
      description: |
        Completes a sign-in the unusual-sign-in policy held for a passkey
        (#65): `login/factor` or the SSO callback set the confirm cookie,
        `login/prove/begin` set the ceremony cookie, and `assertion` is the
        browser's answer to those options. Only the account's own passkey
        completes it -- another account's, one nobody registered, a
        suspected clone and a counter that did not advance are all `401`
        `invalid-credentials`, saying nothing of which. Shares the login
        rate limit (`429` before the signature is looked at); a refused
        assertion keeps its reservation, counts as a failed second factor
        as a wrong confirmation code does, and leaves the ticket open; the
        ceremony stays open for a corrected one, except after a counter
        that did not advance or a passkey removed while the assertion was
        checked, either of which spends it. A dead ceremony (no cookie,
        expired, already used) is `401` `step-expired` and counts as a
        refused assertion does; its cookie is cleared and the ticket
        stays, so `begin` can be asked again. The ticket is used by
        exactly one sign-in and lives 15 minutes. Sets the session cookie
        on success and clears the confirm and passkey ceremony cookies;
        the session list, the sign-in history (marked `confirmed`) and the
        audit record say how the sign-in began (`code` or `sso`), with
        `action=prove` in the audit detail.
      security:
        - confirmLoginCookie: []
          passkeyAssertCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginProveRequest"
      responses:
        "200":
          description: Signed in; sets the session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The assertion was refused (`invalid-credentials`), or the confirm cookie is missing, invalid, expired, already used, not one held for a passkey, or its account is gone, or the ceremony is dead (`step-expired`) -- begin again, or sign in again from the start.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                const: Bearer realm="gate"
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - properties:
                      type:
                        enum:
                          - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#invalid-credentials
                          - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#step-expired
        "403":
          $ref: "#/components/responses/CSRFRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/login/escape:
    post:
      operationId: loginEscape
      summary: Finish a refused or held sign-in with the escape code from the server log
      description: |
        Lets through a sign-in the unusual-sign-in policy refused or held
        (#66, ADR-0011). Only a lone admin -- an admin with no other admin
        able to act -- is ever offered it: `login`, `login/factor` or
        `login/passkey` answered `403` `sign-in-refused`, or held the
        sign-in for a confirmation code or a passkey, and set the escape
        cookie, and the server wrote a one-time code to its own log (or
        handed it to the application's `Config.OnEscapeCode`); nothing in
        any response carries it. `code` is that code, `xxxx-xxxx-xxxx-xxxx`, in either
        case, with or without the dashes. The code is useless without the
        cookie, and the cookie without the code. Shares the login rate
        limit, so an address ban or a lockout refuses it with `429`; a
        wrong code counts as a failed second factor. The ticket is used by
        exactly one sign-in and lives 15 minutes (and until the process
        restarts). Sets the session cookie on success, remembers the
        browser, and clears the escape cookie.
      security:
        - escapeLoginCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscapeCodeRequest"
      responses:
        "200":
          description: Signed in; sets the session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The code was wrong (`invalid-credentials`, "invalid escape code"), or the escape cookie is missing, invalid, expired or already used, or its account is gone (`step-expired`; the cookie is cleared) -- sign in again from the start.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                const: Bearer realm="gate"
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - properties:
                      type:
                        enum:
                          - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#invalid-credentials
                          - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#step-expired
        "403":
          $ref: "#/components/responses/CSRFRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/login/factor/begin:
    post:
      operationId: loginFactorBegin
      summary: Start a passkey sign-in
      description: |
        The passkey half of the second login step, reached with the
        pending-login cookie `POST /api/auth/login` set. Answers the W3C
        request options for `navigator.credentials.get()`, allowing only
        the account's passkeys registered for the current relying party,
        and sets the passkey ceremony cookie (sealed, path
        `/api/auth/login`, five minutes; each challenge is usable once).
        Takes no body.

        Each begin is counted on a limit of the account's own (the
        limiter's threshold per window), never handed back (except when
        the server fails to start the ceremony, `500`), and spends
        none of the sign-in attempts `login/factor` counts: `429` once it
        is spent, while codes and recovery codes still work. A browser
        the account remembers has a limit of its own beside it. A banned
        address or a locked account is `429` unless the browser is one
        the account remembers; a disabled account is `429` to any
        browser.
      security:
        - pendingLoginCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200":
          description: The request options; sets the passkey ceremony cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialAssertion"
        "401":
          $ref: "#/components/responses/StepExpired"
        "403":
          $ref: "#/components/responses/CSRFRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/step-up/passkey/begin:
    post:
      operationId: stepUpPasskeyBegin
      summary: Start a passkey step-up
      description: |
        For a signed-in caller about to grant admin, create an admin,
        unlock their own account or allow their own next sign-in (#82): answers the W3C request options
        for `navigator.credentials.get()`, allowing only the caller's
        passkeys registered for the current relying party, and sets the
        step-up ceremony cookie (`gate_passkey_stepup`, sealed, path
        `/api/auth`, five minutes; each challenge is usable once). The
        browser's answer goes in that route's `assertion` (or
        `adminAssertion`) field, beside the password, in place of a code.
        Takes no body.

        Takes nothing from the account's password re-check budget, so a
        prompt that is cancelled or expires costs no re-check. Each begin
        is counted on a limit of its own for the account (the limiter's
        threshold per window), never handed back (except when the server
        fails to start the ceremony, `500`), so a session alone cannot
        start ceremonies without limit: `429` once it is spent.
        The route that takes the `assertion` checks it on the re-check
        budget, as it checks a code.
        `404` while the application has no passkeys; `409` while its
        relying party is not ready, when the caller holds no passkey
        usable at this address, or when the caller has no local password
        (set one first, as every admin must).
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200":
          description: The request options; sets the step-up ceremony cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialAssertion"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/login/passkey/begin:
    post:
      operationId: loginPasskeyBegin
      summary: Start a sign-in with a passkey alone
      description: |
        Answers the W3C request options for `navigator.credentials.get()`
        with no allowed credentials -- the browser offers its own passkeys
        for this relying party, or its autofill does (conditional
        mediation) -- and user verification required (#77). Reached with no
        session and no cookie, and takes no body. Sets the sign-in ceremony
        cookie (sealed, path `/api/auth`, five minutes; each challenge is
        usable once); the same options and cookie serve `POST
        /api/auth/login/passkey` and a passkey resume at `POST
        /api/auth/reauthenticate`.

        Nothing names an account yet, so it takes one attempt on a limit
        of its own for the client address -- the same size as the login
        limit, but not shared with it, so challenges a browser asks for and
        never uses spend none of the address's sign-in attempts -- and
        keeps it until an assertion on it checks out at `login/passkey`
        or a passkey resume (even if the policy then refuses or holds the
        sign-in, or the server cannot record it); a `500` from begin gives
        it back at once; a banned address or one at that limit is `429`.
        The
        known-browser allowance, which belongs to an account, applies at
        `login/passkey`. `404` unless passkey sign-in is on; `409` while
        the relying party is not ready.
      security:
        - {}
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200":
          description: The request options; sets the sign-in ceremony cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialAssertion"
        "403":
          $ref: "#/components/responses/CSRFRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/login/passkey:
    post:
      operationId: loginPasskey
      summary: Sign in with a passkey alone
      description: |
        Completes the ceremony `POST /api/auth/login/passkey/begin`
        started (#77, NIST SP 800-63B-4: a user-verifying passkey is a
        multi-factor cryptographic authenticator, AAL2). The account is the
        one the assertion's user handle names, read before the signature
        is checked, and from then on this is a password attempt on it for
        the limiter: the account's lockout and disable, the address ban and
        limit and the known-browser allowance all apply (`429` before the
        signature is looked at), and a refused assertion keeps its
        reservation, counted. A completed sign-in gives back this attempt
        and the one `begin` took, and resets the account's count. A
        sign-in the policy refuses or holds gives both back too, without
        resetting the count. A wrong or unknown credential does not count toward the account's run of
        second-factor failures (no password was presented).

        A finish that names no account this credential can sign in to --
        an unknown handle, a passkey the account does not hold, an account
        with no local password -- or that never reaches the account (no
        user handle, an unreadable assertion) is still one attempt on the
        address (#96): it is checked against the address ban and takes
        one attempt from the address's limit, the one a password attempt
        uses, charging no account. At the limit or banned it is `429`
        `rate-limited`, with no `unknownCredential` and the ceremony
        cookie kept; otherwise its `401` counts. A dead ceremony counts
        nothing, except an already-used one whose handle names an account
        this credential can sign in to, which counts against that account
        as a refused assertion does.

        Every refusal -- an unknown handle, a passkey this account does not
        hold or one that is stale or still held for its recovery codes, a
        wrong signature, an assertion that did not verify the user, a
        suspected clone, a counter that did not advance, or an account with
        no local password -- is `401` `invalid-credentials`, saying nothing
        of which. A dead ceremony (no cookie, expired, tampered with,
        already used) is `401` `step-expired`, and its cookie is cleared; a
        refused credential leaves the ceremony open for a corrected
        assertion, except a counter that did not advance or a passkey
        removed while the assertion was checked, either of which spends
        it.

        A refusal whose handle names one of this application's accounts
        that holds no passkey of that ID -- live, stale or held -- names it
        in `unknownCredential` (#92; `UnknownCredentialProblem`), the
        argument of the browser's
        `PublicKeyCredential.signalUnknownCredential()`, so the frontend
        can tell the browser to stop offering it. A handle naming no
        account here gets a plain `Problem` with no member, answering as a
        wrong signature does: an RP ID is a hostname with no port or path
        (W3C WebAuthn Level 3), so another application on the same
        hostname shares the browser's passkeys, and naming one of its
        passkeys would make the browser hide or delete one that still
        works there. The member shows that the handle named an account
        here; the handle is a random 128-bit ID only the passkey's holder
        has. Every other refusal has no member.

        A completed sign-in is first judged for unusual-sign-in signals
        (#55, method `passkey_alone`): it may be refused (`403`
        `sign-in-refused`) or held for a confirmation code (`200`
        `{"confirm": true}`; `POST /api/auth/login/confirm` finishes it --
        a passkey does not skip it). A refusal or hold for an admin whom no
        other admin can act for can set the escape cookie, as at `login`
        (#66). On success the session cookie is set; the session list,
        the sign-in history and the audit record say `passkey_alone`. The
        account's password is unchanged and the forced-password-change
        door still holds.
      security:
        - passkeySignInCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginPasskeyRequest"
      responses:
        "200":
          description: Signed in (sets the session cookie), or a confirmation code was sent (#55; sets the confirm cookie, no session cookie).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Account"
                  - $ref: "#/components/schemas/ConfirmationChallenge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: "The assertion was refused (`invalid-credentials`; `UnknownCredentialProblem` when the handle names an account here that does not hold the passkey, #92), or the ceremony is dead (`step-expired`) -- begin again."
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                const: Bearer realm="gate"
          content:
            application/problem+json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/Problem"
                      - properties:
                          type:
                            enum:
                              - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#invalid-credentials
                              - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#step-expired
                  - $ref: "#/components/schemas/UnknownCredentialProblem"
        "403":
          $ref: "#/components/responses/CSRFRequiredOrSignInRefused"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/reauthenticate:
    post:
      operationId: reauthenticate
      summary: Resume a timed-out session with the password or a passkey alone
      description: |
        After a session has been idle past the application's idle timeout
        (at most one hour) and before its lifetime ceiling (at most 24
        hours from the sign-in), this takes the timed-out session's cookie
        and the account's password and issues a new session ID for the
        same account (#71, NIST SP 800-63B-4 section 2.2.3: a password in
        conjunction with the session secret may re-authenticate after
        inactivity). The
        sign-in time does not change, so the ceiling does not move, and the
        new cookie ends at it. The old session ID ends. `GET
        /api/auth/session` says `resumable: true` while this is possible.

        A passkey that verified the user resumes it too (#77), and is the
        stronger proof. Send `assertion` -- the browser's answer to the
        options `POST /api/auth/login/passkey/begin` gave, with the ceremony
        cookie that route set -- instead of `password`. The user handle
        must be the timed-out session's own account: another account's
        passkey resumes nothing. A refused assertion is `401`
        `invalid-credentials`, counted; a dead ceremony is `401`
        `step-expired`, not counted. When the handle is the session's own
        account and that account holds no passkey with the assertion's ID
        (live, stale or held), the refusal names it in `unknownCredential`
        (#92; `UnknownCredentialProblem`), as `POST /api/auth/login/passkey`
        does; another account's handle, or one naming no account, is never
        named. Both fields is `400`. Neither is a wrong password: `401`
        `invalid-credentials`, counted. An `assertion`
        is `404` unless passkey sign-in is on, and `409` while the relying
        party is not ready. The new session keeps the method of the
        sign-in it continues.

        It is a password sign-in for the limiter: the same per-address and
        per-account limits, lockout, disable, address ban and known-browser
        allowance as `POST /api/auth/login` (`429` at the limit), and a
        wrong password (or refused passkey) is a failed sign-in, counted. It is not judged for
        unusual-sign-in signals (the session it continues already was) and
        never asks for a second factor. Session-exempt like login, and
        still needs the CSRF header.

        Anything that cannot be resumed answers `401` `sign-in-required`
        alike: no cookie, an unknown, live or ended session (logout, sign
        out everywhere, a password change), one past the ceiling, a deleted
        account, an account with no local password, or one that owes a
        password change (sign in again in full, which leads to that door).
        The sign-in history row has method `resume`, and the audit record is
        `user.reauthenticated`.
      security:
        - sessionCookie: []
        - sessionCookie: []
          passkeySignInCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthenticateRequest"
      responses:
        "200":
          description: Resumed. The new session cookie is set. The body is the one a completed login answers with.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: |
            Nothing can be resumed (class `sign-in-required`); the password
            or passkey was wrong (class `invalid-credentials`;
            `UnknownCredentialProblem` when it names a passkey the
            session's own account does not hold, #92); or the passkey
            ceremony is dead (class `step-expired`).
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                const: Bearer realm="gate"
          content:
            application/problem+json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/Problem"
                      - properties:
                          type:
                            enum:
                              - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#sign-in-required
                              - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#invalid-credentials
                              - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#step-expired
                  - $ref: "#/components/schemas/UnknownCredentialProblem"
        "403":
          $ref: "#/components/responses/CSRFRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/logout:
    post:
      operationId: logout
      summary: End this session
      description: Ends the caller's session if there is one and clears the cookie. With no session it is a harmless no-op, not a 401. Takes no body.
      security:
        - {}
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200":
          description: Signed out.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [loggedOut]
                properties:
                  loggedOut:
                    const: true
        "403":
          $ref: "#/components/responses/CSRFRequired"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/logout-all:
    post:
      operationId: logoutAll
      summary: Sign out everywhere
      description: |
        Ends every session the caller's account holds, then issues this
        browser a fresh session (sets the session cookie) and remembers
        it. An account with a local password sends it in `password`
        (rate-limited re-check), and every browser, country and place the
        account remembers, and any allow-sign-in window an admin opened
        for it (#81), is forgotten first. An SSO-only account has no
        password to send: the body is optional, its sessions end, and
        what it remembers is kept, so a session cookie alone cannot reset
        its unusual-sign-in baseline. The new session keeps the old
        session's sign-in time, ceiling and method.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password:
                  type: string
                  description: The caller's own password; required when the account has one.
      responses:
        "200":
          description: Every other session ended.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [signedOutEverywhere]
                properties:
                  signedOutEverywhere:
                    const: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequiredOrInvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/sessions:
    get:
      operationId: listSessions
      summary: List the caller's own sessions
      description: |
        Every live session on the caller's account, newest sign-in first,
        at most 100 rows; `total` counts them all, so a cut list says so.
        Sessions live in the server's memory: a restart empties the list
        and everyone signs in again. A row never carries the session ID
        (it is the cookie); `ref` names the session instead. Needs a
        session, unlike `GET /api/auth/session`. There is no route to
        list another account's sessions.
      responses:
        "200":
          description: The caller's sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/sessions/{ref}:
    delete:
      operationId: endSession
      summary: End one of the caller's own sessions
      description: |
        No password, unlike sign out everywhere for an account with a local
        password: ending a session is a safe direction. Ending the session the request was made with clears the
        cookie and sets `signedOut`. Ends the gauntlet session only, never
        the single sign-on provider's. Takes no body.
      parameters:
        - $ref: "#/components/parameters/SessionRef"
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200":
          description: Ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnded"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/unlock:
    post:
      operationId: unlockWithCode
      summary: Lift the admin's disabled sign-in with the one-time code
      description: |
        When fifty failed sign-ins in a row have disabled the admin's
        sign-in and no other admin can unlock it, a server that starts in
        that state writes a one-time unlock code to its log (#44). This
        lifts the disable, and with it any lockout and the count of
        lockouts (the escalating lockout starts again from zero), and
        nothing else on the account: it issues no session and does not
        touch the password, the second factors or the sessions, though
        this server process also forgets its recent counts for the
        account, as `POST /api/auth/users/{id}/unlock` does. The
        admin then signs in as normal with their existing password and
        second factor. The code is single use -- it stops working once
        the disable is lifted by any means -- and is typed with or without
        its dashes, in either case. Every refusal of the username or code
        is the same `401`, whatever was wrong, counted against the client
        address by the login limiter (`429` at the limit). Reachable
        without a session; still needs the CSRF header.
      security:
        - {}
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockCodeRequest"
      responses:
        "200":
          description: The disable is lifted; the admin can now sign in.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [username, unlocked]
                properties:
                  username:
                    type: string
                  unlocked:
                    const: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/CSRFRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/password:
    post:
      operationId: changePassword
      summary: Change the caller's own password
      description: |
        Needs `currentPassword` unless the account must change its password
        -- an administrator reset it, five second-factor steps in a row
        failed, or a sign-in found the password in a known breach --
        (then only `newPassword`; this is the one route such a
        session can reach, and every cause ended every earlier session, so
        it was opened by a sign-in made since). The re-check is rate-limited per account. Ends every
        session on the account and sets a fresh session cookie.

        An account that signs in only through the identity provider has no
        local password and gets `409`, except an admin: every admin keeps a
        local password (ADR-0010), so an SSO-only admin sets its first one
        here with only `newPassword`, and must do so before any route that
        re-checks the caller's password will work (while the application
        requires admin passkeys, every other route that needs a session
        stops it at the `must-change-password` door, `403`; otherwise they
        answer `409` until it has). It must do so from a session its
        identity provider issued in the last ten minutes; any other session gets `409` asking it to
        sign in again through the provider first.

        A `newPassword` the same as the current password is `400`, under a
        forced change too. An administrator's reset that lands while the
        change is being checked wins: the change is `409` and saves
        nothing, and the owner signs in with the reset code (#80).

        A new password is refused with `400`, and a plain-text reason, when
        it is under 8 characters; on the common-password list, in any
        case; found in a known breach by the live Have I Been Pwned check,
        where the application turned that on; or the account's username
        or the product's name, give or take case, punctuation and digits
        around it (#43). When the live check cannot be reached the
        password is accepted and checked again at the next sign-in, which
        sets `mustChangePassword` on a hit. The same checks apply to
        `register` and `createUser`.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [changed, otherSessionsEnded]
                properties:
                  changed:
                    const: true
                  otherSessionsEnded:
                    const: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequiredOrInvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/totp/enrol:
    post:
      operationId: totpEnrol
      summary: Start authenticator-app enrolment
      description: |
        Password-gated (rate-limited re-check). Stores a fresh secret as
        pending; it can be confirmed by `POST /api/auth/totp/confirm` for
        ten minutes. Enrolling again before confirming replaces the
        pending secret. `409` while the account already has an
        authenticator app, or a first factor is on hold waiting for its
        recovery codes to be confirmed, or the account has no local
        password. Reachable at the must-enrol-factor door.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
      responses:
        "200":
          description: The pending secret, as an otpauth URI for a QR code and as base32 text.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [uri, secret]
                properties:
                  uri:
                    type: string
                    description: "`otpauth://totp/...` URI naming the deployment's `Config.ProductName`."
                  secret:
                    type: string
                    description: The same secret, base32, for typing in by hand.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequiredOrInvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/totp/confirm:
    post:
      operationId: totpConfirm
      summary: Prove a code from the pending authenticator app
      description: |
        Checks one code against the pending secret. On the account's
        first second factor the app and ten new recovery codes are saved
        on hold and the codes returned once, with `pendingConfirmation`
        true: nothing is live and no session changes until `POST
        /api/auth/recovery-codes/confirm`. On an account that already has
        a second factor (a passkey) the app is active at once, every other
        session ends and a fresh session cookie is set; no codes are
        returned. A wrong code is `400` `invalid-request` and is counted on
        the re-check budget (`429` once it is spent). Reachable at the
        must-enrol-factor door.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "200":
          description: Held for confirmation (the first factor), or active (a later one).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [enabled, recoveryCodes]
                properties:
                  enabled:
                    type: boolean
                    description: True when the app is active now; false while `pendingConfirmation` is true.
                  recoveryCodes:
                    description: Ten codes in clear, exactly once, when this app is the account's first second factor (then `pendingConfirmation` is true); `null` when the account already had a second factor (then `alreadyIssued` is true).
                    type: [array, "null"]
                    items:
                      type: string
                  pendingConfirmation:
                    description: Present, and true, when the app and `recoveryCodes` are on hold until `POST /api/auth/recovery-codes/confirm`, and deleted if that does not come within ten minutes.
                    const: true
                  alreadyIssued:
                    description: Present, and true, only when the app went live on an account that already had a second factor, whose recovery codes stand.
                    const: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequiredOrStepExpired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/totp:
    delete:
      operationId: totpDelete
      summary: Remove the caller's own authenticator app
      description: |
        Password-gated (rate-limited re-check). A caller with no local
        password is `409` class `conflict` before its password is checked,
        and nothing is counted. When this leaves the
        account with no second factor, every session on it ends, this one
        included, and `signedOut` is true. With no authenticator app on
        the account the answer is `404` and nothing changes: no session
        ends, nothing is recorded and no notice is sent. An enrolment
        started but never confirmed, even one past its ten minutes, counts
        as an app here: it is removed with `200`, recorded, and a notice
        is sent, as for a confirmed one.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [disabled, signedOut]
                properties:
                  disabled:
                    const: true
                  signedOut:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequiredOrInvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      summary: Replace the caller's recovery codes
      description: |
        Password-gated (rate-limited re-check). A caller with no local
        password is `409` class `conflict` before its password is checked,
        and nothing is counted. Replaces the account's recovery codes with
        ten fresh ones, shown once, in this reply.
        The old set stops working the moment the new one is saved, just
        before the reply is written; if the save fails, the old set stays
        and no codes are issued. Nothing can show the new codes again, so
        a person who missed them (a dropped connection, a closed page)
        regenerates again. An account with a local password and no live
        second factor, including one whose first factor still waits for
        `POST /api/auth/recovery-codes/confirm`, is stopped at its door
        (`403` `must-change-password` while it owes a password change,
        otherwise `must-enrol-factor`, or `must-enrol-passkey` for an admin
        while admin passkeys are required) before this runs; beyond the
        no-local-password case above, `409` answers only a last second
        factor removed while the request was in flight. Other sessions are
        not ended.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
      responses:
        "200":
          description: The new codes, in clear, exactly once.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [recoveryCodes]
                properties:
                  recoveryCodes:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequiredOrInvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/recovery-codes/confirm:
    post:
      operationId: confirmHeldFactor
      summary: Confirm the first second factor's recovery codes were saved
      description: |
        The caller says "I've saved these" for the recovery codes their
        account's first second factor was held with (#58; see "First
        second factor" above). One write makes the held factor and its
        codes live; then every other session on the account ends, this
        browser gets a fresh session (sets the session cookie), and the
        factor is audited. Takes no body. `409` when nothing is on hold;
        `401` `step-expired` when the hold ran out (ten minutes) -- the
        factor and codes are deleted, and the caller sets the factor up
        again. Reachable at the must-enrol-factor door.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200":
          description: The factor and its recovery codes are live.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [confirmed, factor]
                properties:
                  confirmed:
                    const: true
                  factor:
                    type: string
                    enum: [passkey, totp]
                    description: Which factor went live.
        "401":
          $ref: "#/components/responses/SignInRequiredOrStepExpired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/passkeys:
    get:
      operationId: listPasskeys
      summary: List the caller's own passkeys
      description: Every live passkey on the account, stale ones included (registered under an earlier public URL; still removable, never offered at sign-in). A first passkey held for its recovery codes to be confirmed is not listed until it is.
      responses:
        "200":
          description: The caller's passkeys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PasskeyRow"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/passkeys/register/begin:
    post:
      operationId: passkeyRegisterBegin
      summary: Start registering a passkey
      description: |
        Answers the W3C creation options for `navigator.credentials.create()`,
        excluding the account's passkeys already registered for the current
        relying party, and sets the registration ceremony cookie (sealed,
        path `/api/auth/passkeys`, five minutes). Password-gated
        (rate-limited re-check), as authenticator-app enrolment is; refused
        for an account with no local password before the body is read, and
        (`409`, after the password) while a first factor is on hold
        waiting for its recovery codes to be confirmed. Reachable at the
        must-enrol-factor door.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
      responses:
        "200":
          description: The creation options; sets the registration ceremony cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialCreation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequiredOrInvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/passkeys/register/finish:
    post:
      operationId: passkeyRegisterFinish
      summary: Finish registering a passkey
      description: |
        Verifies the browser's credential against the ceremony
        `register/begin` started and stores it. On the account's first
        second factor of either kind the passkey and ten new recovery
        codes are saved on hold and the codes returned once, with
        `pendingConfirmation` true: the passkey is not live, listed or
        offered at sign-in, and no session changes, until `POST
        /api/auth/recovery-codes/confirm`. On an account that already has
        a second factor the passkey is live at once, with no codes. A
        refused credential keeps the ceremony cookie, so it can be
        corrected within the five minutes; a stored passkey, a store
        refusal and a dead or spent ceremony clear it.
        A name holding a control or format character, a line or paragraph
        separator, invalid UTF-8 or U+FFFD is refused with `400` before the
        ceremony cookie is examined, so the ceremony stays live and the
        same credential can be finished again with a good name; nothing
        is stored. Reachable at the must-enrol-factor door.
      security:
        - sessionCookie: []
          passkeyRegisterCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegisterFinishRequest"
      responses:
        "200":
          description: Registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyRegisterFinishResponse"
        "400":
          description: The body is not one JSON object of the documented fields (a malformed body is refused before the ceremony cookie is examined), or `name` holds a character that is not plain text (a control or format character, a line or paragraph separator, or U+FFFD), or the credential was refused (wrong origin, bad signature, malformed; `invalid-request` in every case). The ceremony cookie is kept, so a corrected credential can finish it.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - properties:
                      type:
                        const: https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#invalid-request
        "401":
          description: No valid session (`sign-in-required`), or the ceremony cookie is missing, expired, tampered with or already used, or this ceremony already stored a passkey or was ended by a refusal (`step-expired`) -- begin again. A dead or spent ceremony cookie is cleared.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                const: Bearer realm="gate"
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - properties:
                      type:
                        enum:
                          - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#sign-in-required
                          - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#step-expired
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/passkeys/{id}:
    patch:
      operationId: renamePasskey
      summary: Rename one of the caller's passkeys
      description: Cosmetic, so no password. A blank name becomes `Passkey n`; a long one is cut at 64 characters. A name holding a control or format character, a line or paragraph separator, invalid UTF-8 or U+FFFD is refused with `400` (`invalid-request`), and the stored name is unchanged.
      parameters:
        - $ref: "#/components/parameters/PasskeyID"
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRenameRequest"
      responses:
        "200":
          description: Renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyRow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"
    delete:
      operationId: deletePasskey
      summary: Remove one of the caller's passkeys
      description: |
        Password-gated (rate-limited re-check). A caller with no local
        password is `409` class `conflict` before its password is checked,
        and nothing is counted. When this leaves the
        account with no second factor, its recovery codes are dropped,
        every session on it ends, this one included, and `signedOut` is
        true. While the application requires every admin to hold a
        passkey (#82), an admin's own last passkey usable at this address
        is refused with `409` class `conflict` ("register another passkey
        first"), before the password is checked, so the refusal costs no
        re-check; a stale passkey is always removable, and another
        admin's `DELETE /api/auth/users/{id}/passkeys` stays the way back
        for a lost one.
      parameters:
        - $ref: "#/components/parameters/PasskeyID"
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyRemoved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequiredOrInvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/oidc/login:
    get:
      operationId: oidcLogin
      summary: Start single sign-on
      description: |
        A browser navigation, not a fetch. Sets the flow cookie
        (`gate_oidc_flow`, path `/api/auth/oidc`, five minutes) and
        redirects to the identity provider. Reachable with no session,
        but not before the first account exists: SSO never creates it,
        so this route answers 503 until the local setup code has been
        used.
      security:
        - {}
      responses:
        "302":
          $ref: "#/components/responses/Redirect"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/oidc/callback:
    get:
      operationId: oidcCallback
      summary: Finish single sign-on
      description: |
        Where the identity provider sends the browser back. Always
        redirects when SSO is on: to `/` after a sign-in (sets the session
        cookie), to `/?ssoLinked=1` after a link (sets a fresh session
        cookie), or to the application's `Config.LoginPath` with
        `?ssoError=` and one of `state_mismatch`, `provider_error`,
        `verification_failed`, `not_permitted`, `login_failed`,
        `link_session_changed`, `link_identity_taken`, `link_failed`,
        `refused` (every credential right, and the unusual sign-in policy
        refused it, or held it for a code past the account's
        confirmation-code budget, #55, #84). A sign-in held for a confirmation code
        (#55) instead redirects to `Config.LoginPath` with `?confirm=1`
        and sets the confirm cookie, no session cookie; the frontend
        asks for the code and posts it to `POST /api/auth/login/confirm`.
        One held for a passkey (#65) redirects with `?prove=1` instead,
        and the frontend runs `POST /api/auth/login/prove/begin` and
        posts the assertion to `POST /api/auth/login/prove`. The
        flow cookie is cleared on every path. While no account exists
        yet this route answers 503 like every other route except
        session and register: the first account is never an SSO one.
      security:
        - oidcFlowCookie: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          description: Set by the provider when it refused; never echoed back.
          schema:
            type: string
      responses:
        "302":
          $ref: "#/components/responses/Redirect"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/oidc/link:
    post:
      operationId: oidcLinkStart
      summary: Start linking this account to single sign-on
      description: |
        Sets the flow cookie and returns the provider URL for the browser
        to navigate to; `GET /api/auth/oidc/callback` finishes it. A
        completed link removes the local password, authenticator app,
        recovery codes and passkeys of every account except an admin's:
        every admin keeps theirs (#67). It ends every session on the
        account and signs this browser in again. Password-gated
        (rate-limited re-check), checked before the flow cookie is set;
        `409` for an account that is already SSO-only or already linked
        comes first.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
      responses:
        "200":
          description: Navigate the browser to `url`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [url]
                properties:
                  url:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequiredOrInvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/users:
    get:
      operationId: listUsers
      summary: List accounts (admin)
      responses:
        "200":
          description: Every account.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"
    post:
      operationId: createUser
      summary: Create an account (admin)
      description: |
        The only way to add an account once registration has closed.
        `role` defaults to `user`. Creating an `admin` (#67) also needs
        the caller's own password and a current second factor on the same
        request, in `adminPassword` and either `adminCode` or, since #82,
        `adminAssertion` (as in `UnlockSelfRequest`): the password
        missing, or neither or both of the others, is `400` and checks
        nothing; any of them wrong is `401` and counts against the
        account's password re-check budget (`429` once it is spent), and
        nothing is created. A caller with no local password is `409`
        class `conflict` before any of that. A dead or missing passkey
        step-up is `401` class `step-expired`: start it again. An
        `adminAssertion` while the application has no passkeys is `404`
        once the password has passed, and nothing is created. The fields
        are not read for any other role. The password is
        checked as every new password is (see `changePassword`); a refused
        one is `400`, with the reason. While the application requires
        every admin to hold a passkey (#82), a new admin is created held
        at the `must-enrol-passkey` door until it registers one
        (`heldForPasskey`).
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  description: "`user` (the default when empty or absent), `viewer` or `admin` (with `adminPassword`, and `adminCode` or `adminAssertion`). Anything else is a 400."
                adminPassword:
                  type: string
                  description: The caller's own current password. Only for role `admin`.
                adminCode:
                  type: string
                  description: A current code from the caller's authenticator app, or one of their unused recovery codes (spent if it is used here). Only for role `admin`; not with `adminAssertion`.
                adminAssertion:
                  type: object
                  additionalProperties: true
                  description: The W3C `PublicKeyCredential` JSON `navigator.credentials.get()` produced for the options `POST /api/auth/step-up/passkey/begin` gave, for the caller's own passkey (#82). Only for role `admin`; not with `adminCode`. An open object -- see "Compatibility" above.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/StepUpRefused"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupOrNotPersisted"

  /api/auth/users/{id}:
    delete:
      operationId: deleteUser
      summary: Delete an account (admin)
      description: "Deletes the account, then ends its sessions and revokes every token it created. The last admin cannot be deleted, nor the last admin with a local password while the other admins sign in only through single sign-on (`409` class `last-admin`), and nobody can delete the account they are signed in with (`409` class `conflict`); another admin can be deleted. Takes the calling admin's own password in the body (a rate-limited re-check, #72), checked after the `409` for the caller's own account and before anything is deleted."
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [username, tokensRevoked]
                properties:
                  username:
                    type: string
                  tokensRevoked:
                    type: integer
                    minimum: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequiredOrInvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictOrLastAdmin"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: |
            `server-error` when the account could not be deleted at all.
            `partially-completed`, with `username`, when the account WAS
            deleted but its tokens could not be revoked -- the admin has
            to revoke them by hand.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/Problem"
                      - properties:
                          type:
                            const: https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#server-error
                  - $ref: "#/components/schemas/PartiallyCompletedProblem"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/users/{id}/role:
    put:
      operationId: setUserRole
      summary: Change an account's role (admin)
      description: |
        The one route for every role change among `admin`, `user` and
        `viewer`, in either direction (#67, #75). Granting `admin` needs
        the caller's own password and a current second factor on the same
        request (`password`, and `code` or, since #82, `assertion`, as in
        `UnlockSelfRequest`): the password missing, or neither or both of
        the others, is `400` and checks nothing; any of them wrong is
        `401` and counts against the account's password re-check budget
        (`429` once it is spent), and nothing changes. A caller with no
        local password is `409` class `conflict` before any of that. Any
        other change needs none of them.

        The last admin cannot be demoted, nor the last admin with a local
        password while the other admins sign in only through single
        sign-on (`409` class `last-admin`); an admin may demote themselves
        while another admin remains, and, if they hold a local password,
        while another admin holds one too. An
        account that already holds the role is `409` class `conflict`,
        refused before any step-up is asked for. On an account linked to
        single sign-on, when the deployment maps identity-provider groups
        to roles (#76), a change to `user` or `viewer` is `409` class
        `role-managed-by-sso`, also before any step-up: the provider
        decides that role at every sign-in. Granting `admin` to such an
        account, and demoting an admin, work as for any account. A downgrade (to a lower
        tier than before) ends every session the account holds, the
        caller's own included when it is their own account; a grant ends
        none. Audited as `user.role_changed` with actor, from and to, and
        told to the application as `role-changed`. While the application
        requires every admin to hold a passkey (#82), a grant to an
        account holding none usable here still succeeds, and the account
        is held from its next request until it registers one: at the
        `must-enrol-passkey` door, or first at `must-change-password` when
        it has no local password or owes a password change
        (`heldForPasskey`; the audit detail says "held for a passkey").
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRoleRequest"
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetRoleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/StepUpRefused"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictOrLastAdmin"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/users/{id}/reset-password:
    post:
      operationId: resetPassword
      summary: Issue a one-time reset code (admin)
      description: |
        Issues a single-use reset code for the account, ends its sessions,
        and makes it change its password at next sign-in. The old password
        stops working at once; any lockout or disabled sign-in is lifted;
        the account's remembered browsers, countries and last place are
        forgotten, and any allow-sign-in window ends. The account's owner
        is told through the application (`password-reset`). The code
        exists only in this response; issuing another kills it. Refused
        for the caller's own account and for an SSO-only one. Takes the
        calling admin's own password in the body (a rate-limited re-check,
        #72); the `409` for the caller's own account comes before the
        password is checked, and the one for an SSO-only account after it.
        A missing or wrong password is `401` and counts against the
        re-check budget (`429` once spent); a caller with no local
        password is `409`.
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
      responses:
        "200":
          description: The code, to read out to the account's owner.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [username, code, expiresAt]
                properties:
                  username:
                    type: string
                  code:
                    type: string
                    description: Grouped `xxxx-xxxx-xxxx-xxxx`; accepted back in any case, with or without the dashes.
                  expiresAt:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequiredOrInvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/users/{id}/unlock:
    post:
      operationId: unlockUser
      summary: Lift an account's disabled sign-in or lockout (admin)
      description: |
        Lifts a disabled sign-in (fifty failed sign-ins in a row, #44; it
        also lifts itself 24 hours after it began, #70),
        ends any login lockout and clears the count of lockouts, so the
        account signs in as one that never failed, with the password and
        second factor it already has. Nothing else on the account changes
        -- not its password, second factors, sessions or a forced password
        change -- though this server process also forgets its recent
        counts for the account: attempts, confirmation and escape codes
        sent, and passkey second steps begun. Answers `200` whether or not anything
        was lifted.

        Another account's unlock takes no body. The caller's own takes
        `UnlockSelfRequest`: an admin whose sign-in is disabled but who
        still holds a session must enter their password and a current
        second factor (an authenticator-app code or a recovery code, or
        a passkey, #82) again; the session alone is not enough. The
        password missing, or neither or both of `code` and `assertion`,
        is `400`; any of them wrong is `401` and counts against the
        account's password re-check budget (`429` once it is spent), and
        nothing is unlocked. A caller with no local password is `409`. An
        admin with no session left is unlocked by another admin; when
        every admin's sign-in is disabled, the server writes a one-time
        unlock code to its log as it starts (`POST /api/auth/unlock`;
        restart to get one).
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: false
        description: Only for the caller's own account.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockSelfRequest"
      responses:
        "200":
          description: Unlocked, or there was nothing to lift.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [username, wasDisabled, wasLockedOut]
                properties:
                  username:
                    type: string
                  wasDisabled:
                    type: boolean
                    description: |
                      The account's sign-in was disabled and had not yet
                      lifted itself (it does, 24 hours after it began).
                  wasLockedOut:
                    type: boolean
                    description: A login lockout was in force.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/StepUpRefused"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/users/{id}/allow-sign-in:
    post:
      operationId: allowSignIn
      summary: Allow an account's next sign-in for ten minutes (admin)
      description: |
        Allows the account's next sign-in from any browser or place for
        ten minutes (#81, ADR-0009 decision 11): while the window is
        live, a sign-in the unusual-sign-in policy would hold for a code
        or a passkey, or refuse, completes instead, and its browser,
        country and place are remembered as any completed sign-in's are.
        Nothing is held: the person signs in again, normally. A repeat
        call starts a fresh ten minutes and answers `200`. The account's
        owner is told through the application (`sign-in-allowed`).

        The body is `UnlockSelfRequest` either way. For another account
        it is the calling admin's own `password` alone (a rate-limited
        re-check, #72): a missing or wrong one is `401` and counts
        against the caller's re-check budget (`429` once it is spent),
        and a `code` or `assertion` beside it is `400`. For the caller's
        own account it is the password and exactly one of `code` and
        `assertion`, as own unlock takes (#82): the password missing, or
        neither or both of the two, is `400`; any of them wrong is `401`
        and counts the same way. A caller with no local password is
        `409`.

        The window ends at the clock, at the account's next completed
        sign-in from any browser, and wherever its remembered browsers
        are cleared (a reset code, sign out everywhere, an admin signing
        the account out everywhere). It changes no
        password, second factor or session, and lifts no lockout or
        disable: a locked or disabled account is still refused at the
        password step, so unlock it as well. An account that signs in
        only through single sign-on needs nothing local: its callback
        completes inside the window.
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        description: |
          Another account: `password` only. The caller's own: `password`
          and exactly one of `code` and `assertion`.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockSelfRequest"
      responses:
        "200":
          description: Allowed; the window ends at `allowedUntil` unless a completed sign-in spends it first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [username, allowedUntil]
                properties:
                  username:
                    type: string
                  allowedUntil:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/StepUpRefused"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/users/{id}/logout-all:
    post:
      operationId: adminLogoutAll
      summary: Sign another account out everywhere (admin)
      description: |
        Ends every gauntlet session the account holds and forgets every
        browser, country and place it remembers, and any allow-sign-in
        window, whatever kind of account it is, SSO-only included (the account's own
        sign out everywhere keeps them for an SSO-only account), without
        issuing it a new session. The
        identity provider's own session is not touched. All of the
        account's sessions or none: there is no admin route to end one
        session, or to list another account's sessions (#53).

        The body is optional. `reason` is at most 200 characters of plain text
        (no control or format characters, no line or paragraph separators,
        no U+FFFD);
        it goes into the audit record
        and to the application's `Config.Notices` (or the deprecated
        `Config.Notify`), which may mail the account's owner. `notified`
        is true when the application was asked -- after this response,
        in the background -- not that a message was delivered.

        `409` for the caller's own account: use `POST
        /api/auth/logout-all`, which keeps this browser signed in.
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLogoutAllRequest"
      responses:
        "200":
          description: Every session the account held has ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLogoutAllResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/users/{id}/totp:
    delete:
      operationId: clearUserTOTP
      summary: Remove another account's authenticator app (admin)
      description: "Recovery codes go too only when the account has no passkey left. For a lost phone when the owner still has their password. Refused on the caller's own account. With no authenticator app to remove the answer is `200` with `cleared` false, and nothing is recorded or sent. Takes the calling admin's own password in the body (a rate-limited re-check, #72); the `409` for the caller's own account comes before it is checked. A missing or wrong password is `401` and counts against the re-check budget (`429` once spent); a caller with no local password is `409`."
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
      responses:
        "200":
          description: Removed, or nothing there to remove.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [username, cleared]
                properties:
                  username:
                    type: string
                  cleared:
                    type: boolean
                    description: False when the account had nothing to remove; nothing changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequiredOrInvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/users/{id}/passkeys:
    delete:
      operationId: clearUserPasskeys
      summary: Remove every passkey on another account (admin)
      description: "Recovery codes go too only when the account has no authenticator app left. While the application requires admin passkeys, an admin cleared here is held from their next request until they register one: at the `must-enrol-passkey` door, or first at `must-change-password` while they owe a password change (#82). Refused on the caller's own account. With no passkey to remove the answer is `200` with `cleared` false, and nothing is recorded or sent. Takes the calling admin's own password in the body (a rate-limited re-check, #72); the `409` for the caller's own account comes before it is checked. A missing or wrong password is `401` and counts against the re-check budget (`429` once spent); a caller with no local password is `409`."
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
      responses:
        "200":
          description: Removed, or nothing there to remove.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [username, cleared]
                properties:
                  username:
                    type: string
                  cleared:
                    type: boolean
                    description: False when the account had nothing to remove; nothing changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequiredOrInvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/auth/sign-ins:
    get:
      operationId: listSignIns
      summary: The sign-in history (admin)
      description: |
        Every sign-in attempt the gate has seen, newest first: the password
        step, the second-factor step, a passkey sign-in without a password,
        the confirmation code or passkey an unusual sign-in owed, the
        escape code, resuming a timed-out session (`POST
        /api/auth/reauthenticate`), the SSO callback and every attempt the
        login limiter refused (#53). Kept in the application's third sealed
        document (`signins`, ADR-0006), the newest 10,000 rows by default
        (`gauntlet.DefaultMaxSignInRows`; the application may set up to
        50,000); `total` says how full it is and `since` how far back it
        goes.

        A row may stand for several attempts: one source repeating one
        outcome against one name within 10 minutes is one row whose
        `count` grows and `until` moves. Failed attempts may start at most
        100 rows per 10-minute bucket; past that they are counted in one
        `unrecorded` row for the bucket, which carries only the required
        fields. A name that matched no account is shown masked: its first
        two characters and one `•` per further character, except common
        probe names (root, admin, postgres and the like), which are shown
        as typed. A name that matched an account is the account's
        username.

        `404` when the application keeps no history (`Deps.SignIns` is
        nil). Page by passing the last row's `seq` as `before` while
        `more` is true.
      parameters:
        - name: user
          in: query
          required: false
          description: Only rows for this account `id`.
          schema:
            type: string
        - name: address
          in: query
          required: false
          description: Only rows from this client address, exactly. At most 64 bytes.
          schema:
            type: string
            maxLength: 64
        - name: outcome
          in: query
          required: false
          description: Only rows with this outcome.
          schema:
            $ref: "#/components/schemas/SignInOutcome"
        - name: unusual
          in: query
          required: false
          description: Only rows that raised at least one unusual-sign-in signal -- flagged sign-ins, ones sent a confirmation code or asked for a passkey, ones refused, held sign-ins past the account's confirmation-code send limit, and the escape codes issued with a hold or a refusal. Only `true` is accepted.
          schema:
            type: string
            enum: ["true"]
        - name: before
          in: query
          required: false
          description: Only rows whose `seq` is below this.
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          description: How many rows, 1 to 200; 50 when absent.
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: A page of the history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SetupRequired"

  /api/tokens:
    get:
      operationId: listTokens
      summary: List API tokens (admin)
      description: Metadata only; never a token's value or hash.
      responses:
        "200":
          description: Every token.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/Token"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SetupRequired"
    post:
      operationId: createToken
      summary: Issue an API token (admin)
      description: "The raw value is in this response only; the server keeps its SHA-256 hash. Takes the calling admin's own password in the body (a rate-limited re-check, #72), checked once the name is non-empty and `expiresAt` parses; the other 400s (name too long or not plain text, kind, device, an `expiresAt` not in the future) are decided after it. A missing or wrong password is `401` and counts against the re-check budget (`429` once spent); a caller with no local password is `409`. Only an admin signed in with a session reaches it; a bearer token never does."
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, password]
              properties:
                password:
                  type: string
                  description: The calling admin's own password.
                name:
                  type: string
                  description: Surrounding whitespace is trimmed; what is left must not be empty, and at most 64 characters of plain text (no control or format characters, no line or paragraph separators, no U+FFFD; letters of any script count one each); otherwise a 400.
                kind:
                  type: string
                  description: "One of the kinds the application registered (TokenOptions.Kinds): `api` and `ingest` by default. Empty or absent means `api` (read-only), which is a 400 if the application did not register `api`."
                device:
                  type: string
                  description: Required for, and allowed only on, an `ingest` token. Surrounding whitespace is trimmed; what is left is at most 64 characters of plain text (no control or format characters, no line or paragraph separators, no U+FFFD); otherwise a 400.
                expiresAt:
                  type: string
                  description: |
                    When the token stops working: an RFC 3339 timestamp in
                    the future, or the string `never`. Absent means one year
                    from now. A time that is not in the future, or a value
                    that is neither, is a 400.
      responses:
        "201":
          description: Issued. `value` is the bearer token, shown once; it starts `gnt_`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Token"
                  - required: [value]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequiredOrInvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupOrNotPersisted"

  /api/tokens/{id}:
    delete:
      operationId: revokeToken
      summary: Revoke an API token (admin)
      description: Permanent. Takes no body.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revoked]
                properties:
                  revoked:
                    const: true
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SetupRequired"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: The session cookie. Its real name is the application's `Config.CookieName`, prefixed `__Host-` while `Config.SecureCookie` is true.
    pendingLoginCookie:
      type: apiKey
      in: cookie
      name: gate_pending_login
      description: Set by `POST /api/auth/login` when a second factor is needed; sealed, path `/api/auth/login`, five minutes, used by exactly one sign-in -- once a code, recovery code or passkey completes it, it is refused with 401 at login/factor and login/factor/begin.
    confirmLoginCookie:
      type: apiKey
      in: cookie
      name: gate_confirm_login
      description: Set by `POST /api/auth/login`, `POST /api/auth/login/factor`, `POST /api/auth/login/passkey` or the SSO callback when an unusual sign-in owes a confirmation code (#55) or a passkey (#65); sealed, path `/api/auth/login`, 15 minutes, used by exactly one sign-in. A ticket owing a passkey is read only by `login/prove/begin` and `login/prove`, one owing a code only by `login/confirm`.
    escapeLoginCookie:
      type: apiKey
      in: cookie
      name: gate_escape_login
      description: May be set when a sign-in of an admin no other admin can act for is refused (the `403` `sign-in-refused`) or held for a confirmation code or passkey (the `confirm`/`prove` `200` answer), on the password, second-factor or passkey-alone path (#66) -- not when nothing can announce the code, `Config.OnEscapeCode` panics or does not return within three seconds, or the account's escape-code budget is spent; sealed, path `/api/auth/login`, 15 minutes, used by exactly one sign-in. Never set for a user, a viewer or an SSO sign-in.
    passkeyRegisterCookie:
      type: apiKey
      in: cookie
      name: gate_passkey_register
      description: Set by `POST /api/auth/passkeys/register/begin`; sealed, path `/api/auth/passkeys`, five minutes.
    passkeyAssertCookie:
      type: apiKey
      in: cookie
      name: gate_passkey_assert
      description: Set by `POST /api/auth/login/factor/begin` and `POST /api/auth/login/prove/begin`; sealed, path `/api/auth/login`, five minutes.
    passkeySignInCookie:
      type: apiKey
      in: cookie
      name: gate_passkey_signin
      description: Set by `POST /api/auth/login/passkey/begin`; sealed, path `/api/auth`, five minutes (not `/api/auth/login/passkey`, because the same begin serves the resume route too). Sealed under its own key, so a second-step login's ceremony cookie cannot finish a sign-in with no password before it. Used by `POST /api/auth/login/passkey` and by a passkey resume at `POST /api/auth/reauthenticate`.
    passkeyStepUpCookie:
      type: apiKey
      in: cookie
      name: gate_passkey_stepup
      description: Set by `POST /api/auth/step-up/passkey/begin` (#82); sealed, path `/api/auth`, five minutes. Read only by the routes a passkey step-up finishes -- granting admin, creating an admin, and the admin's own unlock and allow-sign-in -- never by a sign-in, and a sign-in's ceremony cookie is never read there.
    oidcFlowCookie:
      type: apiKey
      in: cookie
      name: gate_oidc_flow
      description: Set by the SSO login and link routes; sealed, path `/api/auth/oidc`, five minutes.

  parameters:
    CSRFHeader:
      name: X-Requested-With
      in: header
      required: true
      description: Must equal the application's `Config.CSRFHeaderValue`. Without it every POST, PUT, PATCH and DELETE is refused with 403 (while no account exists, every route but register answers `503` `setup-required` first).
      schema:
        type: string
    UserID:
      name: id
      in: path
      required: true
      description: The account's `id` from `GET /api/auth/users`.
      schema:
        type: string

    PasskeyID:
      name: id
      in: path
      required: true
      description: The passkey's `id` from `GET /api/auth/passkeys` (its credential ID, base64url without padding).
      schema:
        type: string

    SessionRef:
      name: ref
      in: path
      required: true
      description: A session's `ref` from `GET /api/auth/sessions`.
      schema:
        type: string

  responses:
    # Each response below carries exactly one class (the `type` enum has
    # one value) except where its description says otherwise -- those
    # have as many values as classes it can answer with. See
    # docs/api/errors.md for what each class means and which routes
    # answer which classes under which conditions; this document's own
    # job is only to pin the response shape, not to re-explain the
    # class.
    BadRequest:
      description: The body is not one JSON object of the documented fields (unknown fields and trailing data are refused), or a value in the body, the query or the path is refused. Class `invalid-request`.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#invalid-request
    SignInRequired:
      description: No valid session. Class `sign-in-required`.
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
            const: Bearer realm="gate"
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#sign-in-required
    InvalidCredentials:
      description: The credential given was wrong -- the same body for an unknown username and a wrong password, or for any other pair [errors.md](errors.md#invalid-credentials) lists under "Security pairs sharing this class and body" (an unknown admin username and a wrong unlock code at `unlock`, say). Class `invalid-credentials`.
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
            const: Bearer realm="gate"
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#invalid-credentials
    StepExpired:
      description: A multi-step ceremony (a pending login, a passkey ceremony) is invalid, expired, already completed, or its target is gone -- start it again. Class `step-expired`.
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
            const: Bearer realm="gate"
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#step-expired
    SignInRequiredOrStepExpired:
      description: No valid session (class `sign-in-required`); or the step this route finishes has expired -- a pending authenticator-app secret older than ten minutes, or a first factor held longer than ten minutes without its recovery codes being confirmed (class `step-expired`; start that enrolment again).
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
            const: Bearer realm="gate"
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    enum:
                      - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#sign-in-required
                      - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#step-expired
    CSRFRequiredOrSignInRefused:
      description: |
        The `X-Requested-With` header is missing or wrong (class
        `csrf-required`); or every credential was right and the
        account's unusual-sign-in policy refused the attempt (class
        `sign-in-refused`, #55). No session cookie is set and no
        `X-Auth-Gate` header is sent. For an admin no other admin can act
        for, the escape cookie may be set (#66) -- not when nothing can
        announce the code, `Config.OnEscapeCode` panics or does not return
        within three seconds, or the account's escape-code budget is spent;
        the code goes to the application's `Config.OnEscapeCode`, or else
        the server's log, never the response.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    enum:
                      - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#csrf-required
                      - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#sign-in-refused
    CSRFRequired:
      description: The `X-Requested-With` header is missing or wrong. Class `csrf-required`.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#csrf-required
    Forbidden:
      description: |
        The `X-Requested-With` header is missing or wrong (class
        `csrf-required`, checked first, before any of the rest, on every
        `POST`, `PUT`, `PATCH` or `DELETE`); the account's role is not
        recognized, or (on an admin route) the caller is not an admin
        (class `forbidden`); or the session is stopped at one of three
        doors, named by both `type` and `X-Auth-Gate`
        (`must-change-password`, `must-enrol-factor`,
        `must-enrol-passkey`). Not every one of the five is reachable at every route this is used on (a `GET`
        never reaches the CSRF check; each door exempts the routes it
        lets through), but none is route-specific enough to be worth its
        own response here.
      headers:
        X-Auth-Gate:
          description: |
            Present only when the session is stopped at a door:
            `must-change-password` (an administrator reset the account,
            five second-factor steps in a row failed, which says someone
            else knows the password, or a sign-in found the password in a
            known breach, or, while the application requires admin
            passkeys, the account is an admin with no local password;
            of the routes that need a session, only
            `POST /api/auth/password` is reachable),
            `must-enrol-factor` (the account has no live second factor yet
            -- every local-password account must hold one; of the routes
            that need a session, only the TOTP enrol and confirm routes,
            the passkey register begin and finish routes and
            `POST /api/auth/recovery-codes/confirm` are reachable) or `must-enrol-passkey` (#82: the application
            requires every admin to hold a passkey, and this admin holds
            none usable at this address; the same routes as
            `must-enrol-factor` are reachable, and only a passkey opens
            it).
          schema:
            type: string
            enum: [must-change-password, must-enrol-factor, must-enrol-passkey]
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    enum:
                      - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#csrf-required
                      - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#forbidden
                      - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#must-change-password
                      - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#must-enrol-factor
                      - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#must-enrol-passkey
    SignInRequiredOrInvalidCredentials:
      description: |
        No valid session (class `sign-in-required`); or, re-entering the
        caller's own password to re-prove a session is enough to act on,
        it was wrong (class `invalid-credentials`; counted against the
        account's password re-check budget, `429` once it is spent).
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
            const: Bearer realm="gate"
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    enum:
                      - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#sign-in-required
                      - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#invalid-credentials
    StepUpRefused:
      description: |
        No valid session (class `sign-in-required`); or the caller's own
        password, code or passkey, entered again to re-prove a session
        is enough to act on, was wrong (class `invalid-credentials`;
        counted against the account's password re-check budget, `429`
        once it is spent); or the passkey step-up's ceremony is missing,
        expired or already used (class `step-expired`, #82): start it
        again at `POST /api/auth/step-up/passkey/begin`.
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
            const: Bearer realm="gate"
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    enum:
                      - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#sign-in-required
                      - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#invalid-credentials
                      - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#step-expired
    NotFound:
      description: No account, token, session or passkey has this id or ref; the application has no passkeys, no passkey sign-in, no single sign-on, or no sign-in history configured; the caller has no authenticator app to remove; or the path matches no route at all (`type` is then `about:blank`, with no `detail`; see the "Errors" note above). Class `not-found` otherwise.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    enum:
                      - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#not-found
                      - about:blank
    Conflict:
      description: The request is refused because of the account's or the deployment's current state (an account already in the shape asked for, a relationship the route must not touch, a relying party that is not ready); the detail says which. Class `conflict`.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#conflict
    ConflictOrLastAdmin:
      description: "The request is refused because of the account's or the deployment's current state (class `conflict`), because it would leave the deployment with no admin, or with no admin that can sign in without the identity provider (class `last-admin`), or because the account's role is decided by the identity provider's groups (class `role-managed-by-sso`, #76; the role route only)."
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    enum:
                      - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#conflict
                      - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#last-admin
                      - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#role-managed-by-sso
    TooManyRequests:
      description: Too many attempts from this address or on this account -- failed sign-ins, codes or re-checks, passkey ceremonies begun, or confirmation codes sent -- or the address is banned; try again later. Class `rate-limited`.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#rate-limited
    InternalError:
      description: The server could not complete the request; details are in its log, never in the body. Class `server-error`.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#server-error
    SetupRequired:
      description: No account exists yet; only the session and register routes are reachable. Class `setup-required`.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#setup-required
    NotPersisted:
      description: The deployment has no persistent storage configured. Class `not-persisted`.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#not-persisted
    SetupOrNotPersisted:
      description: No account exists yet (class `setup-required`), or the deployment has no persistent storage configured (class `not-persisted`).
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    enum:
                      - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#setup-required
                      - https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#not-persisted
    Redirect:
      description: Browser redirect.
      headers:
        Location:
          required: true
          schema:
            type: string

  schemas:
    Problem:
      description: |
        RFC 9457 Problem Details (gauntlet #23). `type` is permanent and
        is the only field a frontend branches on; `detail`'s wording may
        change and is never parsed. See docs/api/errors.md for what each
        `type` means, which routes answer it, and the SECURITY note on
        which pairs of outcomes must (and do) share one `type` and one
        `detail`.
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: A permanent link into docs/api/errors.md naming the class, or `about:blank` for the one response this document cannot enumerate per-route (an unmatched path or method).
        title:
          type: string
          description: Fixed per `type`, except `about:blank`'s, which is the status's own text (`Not Found`, `Method Not Allowed`); never read instead of `type`.
        status:
          type: integer
          description: Repeats the HTTP status code. Fixed per `type`, except `about:blank`'s, which is the status of whichever unmatched-route answer it is.
        detail:
          type: string
          description: Free text for a person, naming this call site's own refusal. Never parsed; absent on a response with nothing more specific to say than its `title`.
    PartiallyCompletedProblem:
      description: |
        The `partially-completed` class (status 500, docs/api/errors.md):
        a request that changed something but failed before finishing
        everything it meant to. Closed, as `Problem` and
        `UnknownCredentialProblem` are: its extension members are part of
        the contract -- a given response carries whichever one names what
        still needs doing (never both; only `username` is still sent).
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          const: https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#partially-completed
        title:
          const: Partly completed
        status:
          const: 500
        detail:
          type: string
        totpActive:
          const: true
          description: "No longer sent. 0.2.0's `POST /api/auth/totp/confirm` sent it (true) when the authenticator app went active but its recovery codes could not be generated; since #58 the app and its codes are saved in one write, so that half-done state cannot happen. Kept so the schema stays additive."
        username:
          type: string
          description: Present only from `DELETE /api/auth/users/{id}` -- the account named was deleted, but its API tokens could not be revoked.
    UnknownCredentialProblem:
      description: |
        The `invalid-credentials` refusal of `POST /api/auth/login/passkey`
        when the handle names one of this application's accounts and that
        account holds the assertion's passkey in no form, and of
        `POST /api/auth/reauthenticate` when the timed-out session's own
        account does not (#92; docs/api/errors.md). Closed, as `PartiallyCompletedProblem` is:
        its one extension member is part of the contract.
      type: object
      additionalProperties: false
      required: [type, title, status, unknownCredential]
      properties:
        type:
          const: https://github.com/tomlawesome/gauntlet/blob/main/docs/api/errors.md#invalid-credentials
        title:
          const: Invalid credentials
        status:
          const: 401
        detail:
          type: string
        unknownCredential:
          type: object
          additionalProperties: false
          required: [rpId, credentialId]
          description: The argument of `PublicKeyCredential.signalUnknownCredential()` (W3C WebAuthn Level 3 section 5.1.10.2), unchanged.
          properties:
            rpId:
              type: string
              minLength: 1
              description: The relying party's ID, the one `login/passkey/begin` gave.
            credentialId:
              type: string
              pattern: "^[A-Za-z0-9_-]+$"
              description: The assertion's credential ID, base64url with no padding.
    Role:
      type: string
      description: "`admin`, `user` or `viewer`. Any other value is an account gauntlet refuses on every session-gated route."
    Credentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    ReauthenticateRequest:
      type: object
      additionalProperties: false
      description: Exactly one of `password` or `assertion`.
      oneOf:
        - required: [password]
        - required: [assertion]
      properties:
        password:
          type: string
          description: The password of the account the timed-out session belongs to.
        assertion:
          type: object
          additionalProperties: true
          description: The W3C `PublicKeyCredential` JSON `navigator.credentials.get()` produced for the options `login/passkey/begin` gave, for the timed-out session's own account (#77). An open object -- see "Compatibility" above.
    LoginProveRequest:
      type: object
      additionalProperties: false
      required: [assertion]
      properties:
        assertion:
          type: object
          additionalProperties: true
          description: The W3C `PublicKeyCredential` JSON `navigator.credentials.get()` produced for the options `login/prove/begin` gave. An open object -- see "Compatibility" above.
    LoginPasskeyRequest:
      type: object
      additionalProperties: false
      required: [assertion]
      properties:
        assertion:
          type: object
          additionalProperties: true
          description: The W3C `PublicKeyCredential` JSON `navigator.credentials.get()` produced for the options `login/passkey/begin` gave. An open object -- see "Compatibility" above.
    SetupCredentials:
      type: object
      additionalProperties: false
      required: [username, password, setupCode]
      properties:
        username:
          type: string
        password:
          type: string
        setupCode:
          type: string
          description: The one-time code from the server's log, with or without dashes, in either case.
    UnlockCodeRequest:
      type: object
      additionalProperties: false
      required: [username, unlockCode]
      properties:
        username:
          type: string
        unlockCode:
          type: string
          description: The one-time code from the server's log, with or without dashes, in either case.
    UnlockSelfRequest:
      type: object
      additionalProperties: false
      required: [password]
      description: The password, and exactly one of `code` and `assertion` -- except `allow-sign-in` for another account, which takes the password alone (#81).
      properties:
        password:
          type: string
          description: The caller's current password.
        code:
          type: string
          description: A current code from the caller's authenticator app, or one of their unused recovery codes (spent if it is used here). Not with `assertion`.
        assertion:
          type: object
          additionalProperties: true
          description: The W3C `PublicKeyCredential` JSON `navigator.credentials.get()` produced for the options `POST /api/auth/step-up/passkey/begin` gave, for the caller's own passkey (#82). Not with `code`. A dead or missing step-up is `401` class `step-expired`. An open object -- see "Compatibility" above.
    SetRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        password:
          type: string
          description: The caller's current password. Required, and read, only when `role` is `admin`.
        code:
          type: string
          description: A current code from the caller's authenticator app, or one of their unused recovery codes (spent if it is used here). Read only when `role` is `admin`; it or `assertion` is required then.
        assertion:
          type: object
          additionalProperties: true
          description: The W3C `PublicKeyCredential` JSON `navigator.credentials.get()` produced for the options `POST /api/auth/step-up/passkey/begin` gave, for the caller's own passkey (#82). Read only when `role` is `admin`; not with `code`. An open object -- see "Compatibility" above.
    SetRoleResponse:
      type: object
      additionalProperties: false
      required: [username, from, to, sessionsEnded, heldForPasskey]
      properties:
        username:
          type: string
        from:
          $ref: "#/components/schemas/Role"
        to:
          $ref: "#/components/schemas/Role"
        sessionsEnded:
          type: boolean
          description: True when the change was a downgrade, which ended every session the account held.
        heldForPasskey:
          type: boolean
          description: True when the account is now an admin holding no passkey usable here while the application requires one (#82); it is held from its next request until it registers one -- at the `must-enrol-passkey` door, or first at `must-change-password` when it has no local password or owes a password change.
    PasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
    CodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          description: A current code from the authenticator app being set up.
    ConfirmCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          description: The confirmation code the application delivered, `1234-5678`; the dash and surrounding whitespace are optional.
    EscapeCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          description: The escape code (`xxxx-xxxx-xxxx-xxxx`) from the server's log, or wherever `Config.OnEscapeCode` sent it; dashes, spaces and tabs are optional (a line break is not), and either case is accepted.
    LoginFactorRequest:
      type: object
      additionalProperties: false
      description: Exactly one of `code` or `assertion`.
      oneOf:
        - required: [code]
        - required: [assertion]
      properties:
        code:
          type: string
          description: An authenticator-app code, or a recovery code.
        assertion:
          type: object
          additionalProperties: true
          description: The W3C `PublicKeyCredential` JSON `navigator.credentials.get()` produced for the options `login/factor/begin` gave. An open object -- see "Compatibility" above.
    CredentialCreation:
      type: object
      additionalProperties: true
      required: [publicKey]
      description: The W3C `CredentialCreationOptions` JSON (an object holding `publicKey`) the WebAuthn library produced, for `navigator.credentials.create()`. An open object -- see "Compatibility" above.
    CredentialAssertion:
      type: object
      additionalProperties: true
      required: [publicKey]
      description: The W3C `CredentialRequestOptions` JSON (an object holding `publicKey`) the WebAuthn library produced, for `navigator.credentials.get()`. An open object -- see "Compatibility" above.
    SessionRow:
      type: object
      additionalProperties: false
      required: [ref, current, signedInAt, lastUsedAt]
      properties:
        ref:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: A one-way reference to the session (not its ID, which is the cookie); what `DELETE /api/auth/sessions/{ref}` takes.
        current:
          type: boolean
          description: True for the session this request was made with.
        signedInAt:
          type: string
          format: date-time
          description: When the sign-in began. A password change, a held first factor's recovery codes confirmed, an authenticator app confirmed beside a passkey and linking single sign-on start a fresh sign-in time (a passkey added beside a live factor does not); resuming the session and signing out everywhere keep it.
        lastUsedAt:
          type: string
          format: date-time
          description: The last request the session made; until then, when it was issued (as for `address`).
        address:
          type: string
          maxLength: 64
          description: The client address the application resolved when the session was issued -- at sign-in, or at the request that last replaced it (resuming it, signing out everywhere, changing the password, confirming a held first factor's recovery codes or an authenticator app beside a passkey, linking single sign-on). Absent when none was recorded.
        userAgent:
          type: string
          maxLength: 256
          description: The browser's `User-Agent` when the session was issued (as for `address`), with control and formatting characters and line and paragraph separators removed. Absent when none was sent.
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          description: The country `address` resolved to when the session was issued (as for `address`), if a country lookup is configured and the address matched. Absent otherwise.
        unusual:
          $ref: "#/components/schemas/UnusualSignals"
        method:
          type: string
          enum: [password, code, passkey, passkey_alone, sso]
          description: How the sign-in that started the session was made -- `code` is a password then a code, `passkey` a password then a passkey, `passkey_alone` a passkey on its own. A resumed or rotated session keeps the method of the sign-in it continues. Absent when none was recorded. New values may be added.
    SessionList:
      type: object
      additionalProperties: false
      required: [sessions, total]
      properties:
        sessions:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/SessionRow"
        total:
          type: integer
          minimum: 1
          description: How many live sessions the account holds; more than the rows only when the list was cut at 100.
    SessionEnded:
      type: object
      additionalProperties: false
      required: [ended, signedOut]
      properties:
        ended:
          const: true
        signedOut:
          type: boolean
          description: True when the session ended was this one; the cookie has been cleared.
    PasskeyRow:
      type: object
      additionalProperties: false
      required: [id, name, createdAt, stale, rpId]
      properties:
        id:
          type: string
          description: The credential ID, base64url without padding.
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          description: Absent until the passkey is first used -- to sign in, resume a session or confirm a step-up.
        transports:
          type: array
          description: How the authenticator said it can be reached (`usb`, `nfc`, `ble`, `internal`, `hybrid`, ...); absent when it said nothing.
          items:
            type: string
        stale:
          type: boolean
          description: Registered under a different relying party (the public URL changed since); never offered at sign-in. False whenever the relying party is not ready.
        rpId:
          type: string
          description: The relying-party ID the passkey was registered under.
    PasskeyRegisterFinishRequest:
      type: object
      additionalProperties: false
      required: [credential]
      properties:
        credential:
          type: object
          additionalProperties: true
          description: The W3C `PublicKeyCredential` JSON `navigator.credentials.create()` produced. An open object -- see "Compatibility" above.
        name:
          type: string
          description: A label for the list; blank becomes `Passkey n`, and it is cut at 64 characters. Plain text only -- a control or format character, a line or paragraph separator, or U+FFFD, is refused with `400` (letters of any script, accents and emoji are fine).
    PasskeyRegisterFinishResponse:
      type: object
      additionalProperties: false
      required: [passkey, recoveryCodes]
      properties:
        passkey:
          $ref: "#/components/schemas/PasskeyRow"
        recoveryCodes:
          description: Ten codes in clear, exactly once, when this was the account's first second factor (then `pendingConfirmation` is true); `null` otherwise (then `alreadyIssued` is true).
          type: [array, "null"]
          items:
            type: string
        pendingConfirmation:
          description: Present, and true, when the passkey and `recoveryCodes` are on hold until `POST /api/auth/recovery-codes/confirm`, and deleted if that does not come within ten minutes.
          const: true
        alreadyIssued:
          description: Present, and true, only when the passkey went live on an account that already had a second factor, whose recovery codes stand.
          const: true
    PasskeyRenameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
    PasskeyRemoved:
      type: object
      additionalProperties: false
      required: [removed, signedOut]
      properties:
        removed:
          const: true
        signedOut:
          type: boolean
          description: The account was left with no second factor, so every session on it ended, this one included.
    Account:
      type: object
      additionalProperties: false
      required: [username, role]
      properties:
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    CreatedAccount:
      type: object
      additionalProperties: false
      required: [username, role, heldForPasskey]
      properties:
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        heldForPasskey:
          type: boolean
          description: True when the new account is an admin and the application requires every admin to hold a passkey (#82); it is held at the `must-enrol-passkey` door until it registers one.
    ConfirmationChallenge:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm:
          type: boolean
          const: true
          description: A confirmation code was sent through the application; post it to `POST /api/auth/login/confirm`. Says nothing about where it went.
    ProveChallenge:
      type: object
      additionalProperties: false
      required: [prove, passkeyOrigin]
      properties:
        prove:
          type: string
          const: passkey
          description: The sign-in is held until a passkey of this account answers. Run `POST /api/auth/login/prove/begin`, then post the assertion to `POST /api/auth/login/prove`.
        passkeyOrigin:
          type: string
          description: The origin `navigator.credentials.get()` must be run against, as in the second-step answer.
    SecondFactorChallenge:
      type: object
      additionalProperties: false
      required: [secondFactor]
      properties:
        secondFactor:
          type: array
          description: Factors to offer next, `passkey` first when listed, then `totp`. A recovery code is always accepted.
          items:
            type: string
            enum: [passkey, totp]
        passkeyOrigin:
          type: string
          description: The origin passkeys work at (scheme, host and port); present only when `passkey` is listed.
    SessionState:
      type: object
      additionalProperties: false
      required:
        - setupRequired
        - ssoAvailable
        - authenticated
        - hasLocalPassword
        - ssoConnected
        - mustChangePassword
        - mustEnrolSecondFactor
        - mustEnrolPasskey
        - hasTOTP
      properties:
        setupRequired:
          type: boolean
          description: No account exists yet; show first-run registration, which asks for the setup code from the server's log, and hide the SSO button (SSO cannot create the first account).
        ssoAvailable:
          type: boolean
        authenticated:
          type: boolean
        username:
          type: string
          description: Present only while authenticated.
        role:
          $ref: "#/components/schemas/Role"
        hasLocalPassword:
          type: boolean
          description: False for an SSO-provisioned account that never set one.
        ssoConnected:
          type: boolean
        mustChangePassword:
          type: boolean
          description: The session is stopped at the change-password door -- an administrator reset the account, five second-factor steps in a row failed, or a sign-in found the password in a known breach. The account does not record which, so a frontend should not say. Also true for an admin with no local password (`hasLocalPassword` false) while the application requires admin passkeys (#82); it sets its first password from a fresh SSO sign-in.
        mustEnrolSecondFactor:
          type: boolean
          description: True only when the account has no live second factor yet -- every local-password account must hold one. Still true while a first factor is held for its recovery codes to be confirmed.
        mustEnrolPasskey:
          type: boolean
          description: True exactly when the session is stopped at the admin passkey door (#82) -- the application requires every admin to hold a passkey, and this admin holds none usable at this address (an authenticator app does not count). May be true beside `mustEnrolSecondFactor`.
        adminPasskeyRequired:
          type: boolean
          description: "Whether this application requires every admin to hold a passkey (`Config.AdminPasskey`, #82). Present only while authenticated."
        hasTOTP:
          type: boolean
          description: A confirmed authenticator app, not a pending enrolment.
        passkeys:
          type: object
          additionalProperties: false
          required: [count, status]
          description: Present while authenticated, when the application has passkeys at all; and, while signed out, only when signing in with a passkey alone is on and ready (`count` is then 0), so a login page knows to offer it.
          properties:
            count:
              type: integer
              description: How many live passkeys the account holds, stale ones included; a first passkey held for its recovery codes to be confirmed is not counted until it is.
            status:
              type: string
              enum: [ready, unset, ip, insecure]
              description: Whether passkeys work here, and why not -- `unset` (no usable public URL), `ip` (it is an IP address), `insecure` (not https, and not plain http on localhost).
            origin:
              type: string
              description: Present only when `status` is `ready`.
            signIn:
              const: true
              description: Present, as `true`, only when signing in with a passkey alone is on (`Config.PasskeySignIn`) and the relying party is ready (#77), so `POST /api/auth/login/passkey/begin` and `/api/auth/login/passkey` work.
        signedInSince:
          type: string
          format: date-time
          description: This session's start (RFC 3339, seconds); present only while authenticated.
        resumable:
          const: true
          description: |
            Present, as `true`, only while `authenticated` is false and the
            request's session cookie names a session that timed out through
            inactivity inside its lifetime ceiling (at most 24 hours from the
            sign-in) and can be resumed with the password alone, or a
            user-verifying passkey when `passkeys.signIn`
            (`POST /api/auth/reauthenticate`, #71, #77). A frontend
            then asks for the password instead of showing the full sign-in
            form. Absent otherwise.
    UserSummary:
      type: object
      additionalProperties: false
      required: [id, username, role, createdAt, hasLocalPassword, sso, hasTOTP, passkeyCount, heldForPasskey]
      properties:
        id:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time
        lastLogin:
          type: string
          format: date-time
          description: Absent until the account first signs in.
        hasLocalPassword:
          type: boolean
        sso:
          type: boolean
          description: Linked to an SSO identity.
        hasTOTP:
          type: boolean
        passkeyCount:
          type: integer
          description: How many passkeys the account holds.
        heldForPasskey:
          type: boolean
          description: True when the application requires every admin to hold a passkey (#82) and this admin holds none usable here, so it is held at a door until it registers one.
    Token:
      type: object
      additionalProperties: false
      required: [id, name, kind, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          description: "One of the kinds the application registered (TokenOptions.Kinds): `api` or `ingest` by default."
        device:
          type: string
          description: Present only on an `ingest` token.
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          description: Absent until the token is first used.
        expiresAt:
          type: string
          format: date-time
          description: When the token stops working; absent for a token that never expires, which includes every token issued before expiry existed. An expired token is refused like an unknown one and stays listed until it is revoked. When the application runs `Gate.SweepTokens` (daily), a token unused for a year is removed, and the account that created it is told through `Config.Notices` once the token is within a week of expiring (`token-expiring`).
        value:
          type: string
          description: "The raw bearer token; only in the response that creates it. Starts `gnt_` when issued since #74; an older token has no prefix."
    SignInOutcome:
      type: string
      enum: [success, password_ok, no_such_user, wrong_password, factor_refused, locked, disabled, rate_limited, sso_refused, refused, confirm_sent, confirm_refused, escape_issued, escape_refused, unrecorded]
      description: |
        How an attempt ended. `password_ok` is the right password with a
        second factor still owed; `no_such_user` a name that matched no
        account (or, for method `passkey_alone`, a user handle or assertion
        that named none, with no username); `factor_refused` a wrong or used
        code or a refused passkey; `locked` and `disabled` the login
        limiter refusing it before any credential was checked;
        `rate_limited` the same, or a held sign-in past the account's
        confirmation-code send limit (#84), or a refused `passkey_alone`
        finish past the address's limit (#96); `refused`
        every credential right but the attempt refused by the unusual
        sign-in policy; `confirm_sent` every credential right and a
        confirmation code sent -- or a passkey asked for (#65) -- no
        session yet; `confirm_refused` a wrong confirmation code or a
        refused passkey assertion; `escape_issued` an escape code issued
        for a lone admin whose sign-in was refused or held (#66) -- handed
        to `Config.OnEscapeCode`, else written to the server's log -- no
        session yet (recorded beside the `refused` or `confirm_sent`
        row); `escape_refused` a wrong
        escape code; `unrecorded` the failed attempts past a
        bucket's row budget. New values may be added.
    UnusualSignals:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        enum: [new-browser, new-country, impossible-travel]
      description: |
        The unusual-sign-in signals the sign-in raised and the policy
        does not turn off (#55), in this order: `new-browser` (the account
        remembers a browser, and not this one), `new-country` (the account
        remembers a country from the last 90 days, and not this one),
        `impossible-travel` (too far from its last located sign-in for the
        time between them). Absent for an ordinary sign-in. New values may
        be added; ignore unknown ones.
    SignInRow:
      type: object
      additionalProperties: false
      required: [seq, at, until, count, outcome]
      properties:
        seq:
          type: integer
          minimum: 1
          description: The row's number, rising in the order rows began; what `before` takes.
        at:
          type: string
          format: date-time
          description: The first attempt the row stands for.
        until:
          type: string
          format: date-time
          description: The last attempt the row stands for.
        count:
          type: integer
          minimum: 1
          description: How many attempts the row stands for.
        outcome:
          $ref: "#/components/schemas/SignInOutcome"
        userId:
          type: string
          description: The account the attempts were on. Absent when no account was found for them -- a name or passkey that matched none, a `passkey_alone` attempt refused before naming one, or any `sso_refused` row (refused before its account is looked up) -- and on an `unrecorded` row (which carries only `seq`, `at`, `until`, `count` and `outcome`).
        username:
          type: string
          description: The account's username, or the name typed, masked (see the operation). Absent on an `unrecorded` row, and for an empty name.
        method:
          type: string
          enum: [password, code, passkey, passkey_alone, sso, resume]
          description: What the attempt presented. `passkey` is a passkey as the second step after a password; `passkey_alone` a user-verifying passkey with no password (#77). `resume` is the password alone, or a user-verifying passkey, to resume a timed-out session (#71). New values may be added.
        address:
          type: string
          maxLength: 64
          description: The client address the application resolved, for the first attempt.
        userAgent:
          type: string
          maxLength: 256
          description: The first attempt's `User-Agent`, with control and formatting characters and line and paragraph separators removed.
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          description: The country `address` resolved to for the first attempt, if a country lookup is configured and the address matched. Absent otherwise.
        lockedUntil:
          type: string
          format: date-time
          description: The end of the lockout this attempt started, or for `locked` the one in force.
        disabled:
          type: boolean
          description: True on the failure that disabled the account's sign-in, and on a `disabled` refusal.
        unusual:
          $ref: "#/components/schemas/UnusualSignals"
        confirmed:
          type: boolean
          description: "True on a `success` completed through a confirmation code (`POST /api/auth/login/confirm`), a passkey proof (`POST /api/auth/login/prove`, #65), an escape code (`POST /api/auth/login/escape`, #66) or an admin's allow-sign-in window (`POST /api/auth/users/{id}/allow-sign-in`, #81). Absent when false."
    SignInList:
      type: object
      additionalProperties: false
      required: [signIns, more, total]
      properties:
        signIns:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/SignInRow"
        more:
          type: boolean
          description: More rows match beyond this page.
        total:
          type: integer
          minimum: 0
          description: How many rows the history holds.
        since:
          type: string
          format: date-time
          description: When the oldest row began. Absent while the history is empty.
    AdminLogoutAllRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 200
          description: Why, for the audit and the account owner's notice. At most 200 characters; control and format characters, the line and paragraph separators (U+2028, U+2029) and U+FFFD are refused with `400`.
    AdminLogoutAllResponse:
      type: object
      additionalProperties: false
      required: [username, ended, notified]
      properties:
        username:
          type: string
        ended:
          type: integer
          minimum: 0
          description: How many live sessions ended.
        notified:
          type: boolean
          description: The application's notifier was asked to tell the account's owner. Asked, not delivered.
