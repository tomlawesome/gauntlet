# Exceptions to the shared personal-details check (#118, #121).
#
# Every table excuses exact values in named files and nothing else: gitleaks
# drops a finding only when its rule is in targetRules, its file matches
# paths and its matched text matches one of regexes (condition = "AND").
# One anchored regex per literal, dots escaped, so a new address in any of
# these files is still a finding, and a listed value in any other file is
# too. Files that hold the same values share a table. IPv6 values escape
# their colons as well (\: is a literal colon): spelled plainly, they would
# be ipv6-address findings in this file.
#
# Values the shared rules already allow everywhere (the documentation
# ranges, loopback, the unspecified address, limited broadcast) need no
# entry. None of the values below is a real address: document section and
# version numbers that read as addresses, reserved and special-purpose
# ranges the location code tests against, public resolvers, MaxMind's
# test-database addresses and invented test values. To add one, list the
# exact value under the file that holds it; never add a table without
# regexes, and never widen a regex to a range a host could own.

# The public release identity's GitHub no-reply address, which the
# publish-gate job uses as the author of the public snapshot (#118).
[[allowlists]]
description = "public release identity (GitHub no-reply address)"
targetRules = ["email-address"]
condition = "AND"
paths = ['''^\.gitlab-ci\.yml$''']
regexes = ['''^76453276\+tomlawesome@users\.noreply\.github\.com$''']

