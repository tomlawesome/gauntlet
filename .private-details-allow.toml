targetRules = ["ip-address"]
condition = "AND"
paths = [
  '''^CHANGELOG\.md$''',
  '''^gate/config\.go$''',
  '''^internal/plaintext/plaintext\.go$''',
  '''^passwordcheck\.go$''',
  '''^store\.go$''',
]
