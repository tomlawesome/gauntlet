# GitLab is where gauntlet is developed and released (AGENTS.md); this
# file is the CI that gates every merge request and every push to the
# default branch, `dev`. Modelled on birdcage's `.gitlab-ci.yml`, but far
# smaller: gauntlet ships a tag, not an image, so there is no build,
# image or live-stack e2e stage here -- see docs/testing.md. The
# `release` stage is a button on a green `dev` pipeline that creates the
# annotated `v<VERSION>` tag and its GitLab release (docs/releasing.md).
#
# GitHub `tomlawesome/gauntlet` is a read-only public mirror (#17, owner
# 2026-09-29): the `sync` stage pushes `dev`, `preview`, `main` and `v*`
# tags there, so apps can `go get` a tag by the module path. It reads
# MIRROR_TO_GITHUB and GITHUB_MIRROR_SSH_KEY, protected project CI/CD
# variables only the owner sets; nothing here sets them, and without them
# the job never runs.
#
# Runner lane (ai/agent-infra#3): `light` is 4 CPU / 6 GB, which is ample
# for a dependency-free Go module. `big` is not needed here.

stages:
  - lint
  - test
  - release
  - sync

default:
  tags: [light]
  interruptible: true
  # Every job starts in a fresh container, and five of the six build a
  # pinned tool from source on top of fetching the module graph. Both
  # caches live under the project dir (GOMODCACHE/GOCACHE below) so one
  # cache entry carries them between pipelines; the key turns over when
  # a dependency or a tool version changes.
  # Each job gets its own entry (CI_JOB_NAME_SLUG in the prefix). The
  # lint jobs run at the same time and each builds a different tool, so
  # with one shared entry the last job to finish overwrote the others'
  # work and the cache took several pipelines to settle after every key
  # change (refs #24). Per job, each entry holds exactly what that job
  # builds and is warm from the next pipeline on.
  # Protected refs get their own cache. A merge-request pipeline can
  # write anything into .gocache/, and a push pipeline on dev carries
  # the protected variables in every job's environment, so the two must
  # never share a cache entry.
  cache:
    key:
      prefix: $CI_COMMIT_REF_PROTECTED-$CI_JOB_NAME_SLUG
      files:
        - go.sum
        - .gitlab-ci.yml
    paths:
      - .gocache/
  # Infra-only retry: a job that fails because the runner died or hung
  # gets one automatic second try; a job that fails because the code is
  # wrong does not, and never silently passes on a retry.
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - scheduler_failure

variables:
  GOFLAGS: "-mod=readonly"
  GOMODCACHE: $CI_PROJECT_DIR/.gocache/mod
  GOCACHE: $CI_PROJECT_DIR/.gocache/build
  # Same image, same tag, as birdcage's GOLANG_IMAGE -- routed through the
  # group's dependency proxy the same way, so this pull is cached on the
  # GitLab server rather than re-crossing the WAN on every job (refs
  # ai/birdcage#128).
  GOLANG_IMAGE: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/golang:1.27
  ALPINE_IMAGE: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/alpine:3.24

# Avoids the duplicate branch+MR pipeline birdcage's own `.gate` anchor
# avoids: a merge request always gets a pipeline, and so does a push to
# `dev` itself (in practice, a merge landing); a push to any other branch
# does not, because that same commit already has -- or is about to get --
# an MR pipeline covering it.
.gate: &gate
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"

.git_safe: &git_safe
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"

# ---------------------------------------------------------------------------
# LINT
# ---------------------------------------------------------------------------
lint:go:
  stage: lint
  image: $GOLANG_IMAGE
  <<: [*gate, *git_safe]
  timeout: 10m
  script:
    - go build ./...
    - go vet ./...
    - |
      files=$(git ls-files '*.go')
      [ -n "$files" ] || { echo "git ls-files returned no Go files"; exit 1; }
      unformatted=$(gofmt -l $files)
      [ -z "$unformatted" ] || { echo "Not gofmt-clean:"; echo "$unformatted"; gofmt -d $files; exit 1; }
    # Built from source with the image's Go, matching birdcage's own
    # lint:go: a prebuilt binary built with an older Go refuses go.mod's
    # `go 1.27.0` directive.
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
    - golangci-lint run ./...

lint:licences:
  stage: lint
  image: $GOLANG_IMAGE
  <<: [*gate, *git_safe]
  timeout: 10m
  script:
    - scripts/licence-check.sh

lint:vulncheck:
  stage: lint
  image: $GOLANG_IMAGE
  <<: [*gate, *git_safe]
  timeout: 10m
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
    - govulncheck ./...

# The exported Go API against the last release tag (ADR-0002, #22):
# fails on a removed or renamed identifier, passes on additions. apidiff
# runs through `go run` at a pinned pseudo-version inside the script, so
# it never enters go.mod; scripts/apidiff.sh runs the same check locally.
# Full history and the tags are fetched so the base tag is there to diff.
lint:apidiff:
  stage: lint
  image: $GOLANG_IMAGE
  <<: [*gate, *git_safe]
  timeout: 10m
  variables:
    GIT_DEPTH: 0
  script:
    - git fetch --tags --force --quiet origin
    - scripts/apidiff.sh

# gitleaks is a Go module, so it installs the same way golangci-lint and
# govulncheck do above -- no separate image or Docker Hub pull needed.
# `--redact` keeps a matched secret's own bytes out of the job log even
# when the job is red.
lint:secrets:
  stage: lint
  image: $GOLANG_IMAGE
  <<: [*gate, *git_safe]
  timeout: 10m
  variables:
    GIT_DEPTH: 0 # gitleaks scans git history; a shallow clone would miss all but the newest commit.
  script:
    - go install github.com/zricethezav/gitleaks/v8@v8.30.1
    - gitleaks detect --no-banner --redact

# ---------------------------------------------------------------------------
# TEST
# ---------------------------------------------------------------------------
test:go:
  stage: test
  image: $GOLANG_IMAGE
  <<: [*gate, *git_safe]
  timeout: 15m
  # Run the suite as a NON-ROOT user, as birdcage#93 does. persist's
  # permission tests (unreadable or unwritable store files) skip
  # themselves as uid 0 -- correctly, because root ignores the mode bits
  # they set -- and this image runs as root, so until 2026-09-30 those
  # error paths ran only on workstations and CI read persist 2.3 points
  # below the local figure, under its floor (refs #16).
  #
  # The shared cache is handed to tester rather than moved, so the job
  # keeps it; tester writes the profile to its own directory, and root
  # copies it back for the artifact.
  #
  # The copy sits in the same script item as `go test` and runs whatever
  # the tests returned: a later item never runs once one fails, and
  # `artifacts.when: always` cannot upload a coverage.out that was never
  # copied out (refs #24). `|| rc=$?` keeps a failure from ending the
  # shell under `set -e` before the copy; the item then fails with the
  # tests' own exit code. It must not `exit 0` on success -- all items
  # share one shell, so that would skip the coverage lines below.
  script:
    - |
      set -eu
      useradd --create-home --uid 1001 tester
      mkdir -p .gocache
      chown -R tester:tester .gocache
      install -d -o tester -g tester /tmp/gotest
    - |
      rc=0
      su tester -c "cd '$CI_PROJECT_DIR' && \
        HOME=/home/tester \
        GOCACHE='$GOCACHE' \
        GOMODCACHE='$GOMODCACHE' \
        GOFLAGS='$GOFLAGS' \
        go test ./... -race -coverprofile=/tmp/gotest/coverage.out" || rc=$?
      if [ -f /tmp/gotest/coverage.out ]; then
        cp /tmp/gotest/coverage.out coverage.out
      fi
      [ "$rc" -eq 0 ] || exit "$rc"
    - go tool cover -func=coverage.out | tail -1
    - python3 scripts/coverage-floor.py coverage.out
  coverage: '/total:\s+\(statements\)\s+([\d.]+)%/'
  artifacts:
    expire_in: 1 day
    when: always
    paths:
      - coverage.out

# ---------------------------------------------------------------------------
# RELEASE
# ---------------------------------------------------------------------------
# Birdcage's release:promote / release:gitlab pair, cut down: there are no
# images, so the whole cut is "tag this commit". release:version is the
# button; it reads the tracked VERSION file and refuses a tag that already
# exists, so a forgotten bump fails closed. release:gitlab then creates
# the annotated tag and the release. release-cli acts with the rights of
# whoever pressed the button, and `v*` tags are protected, so only the
# owner can actually cut one (#17). The tag's own pipeline runs the sync
# job below, which carries the tag object to the GitHub mirror.
#
# release:version also rejects a VERSION that isn't a strict semantic
# version, one that doesn't sort above every tag already cut, and a
# commit that isn't the current tip of dev -- an old pipeline's button
# must not tag a commit dev has moved past (refs #26). The checks are in
# scripts/release-version-check.sh so they can be tested offline.
release:version:
  stage: release
  image: $ALPINE_IMAGE
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      when: manual
      # A manual job is allow_failure by default; forcing it false would
      # leave every dev pipeline reading "blocked" for a release nobody
      # intends to cut yet. A human is watching the job they pressed.
      allow_failure: true
  # No `needs:` on purpose: without one the button is not playable until
  # every job in every earlier stage has passed, which is the bar.
  cache: []
  script:
    - apk add --no-cache git >/dev/null
    - |
      set -eu
      version="$(tr -d '[:space:]' < VERSION)"
      remote_tags="$(git ls-remote --tags origin)"
      dev_sha="$(git ls-remote origin refs/heads/dev | cut -f1)"
      scripts/release-version-check.sh "$version" "$remote_tags" "$dev_sha" "$CI_COMMIT_SHA" > release.env
      cat release.env
  artifacts:
    reports:
      dotenv: release.env
    expire_in: 90 days

release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
  needs:
    - job: release:version
      artifacts: true
  cache: []
  script:
    - echo "tagging $CI_COMMIT_SHA as $RELEASE_TAG"
  release:
    tag_name: $RELEASE_TAG
    tag_message: gauntlet $RELEASE_TAG
    ref: $CI_COMMIT_SHA
    name: $RELEASE_TAG
    description: |
      gauntlet $RELEASE_TAG -- see CHANGELOG.md for what changed.

      Apps take it with `go get github.com/tomlawesome/gauntlet@$RELEASE_TAG`
      (the GitHub mirror carries the tag) or by the GitLab path.

# ---------------------------------------------------------------------------
# SYNC
# ---------------------------------------------------------------------------
# Copied from birdcage's sync:mirror-to-github. Its own rules, not `.gate`:
# it fires only on a push pipeline -- a merge landing on one of the three
# long-lived branches, or a release tag -- and only once the owner has set
# MIRROR_TO_GITHUB. The variables are protected, so they reach a pipeline
# only on a protected branch or tag; `v*` tags have to be protected for a
# release to reach GitHub (#17). GitLab is the only writer: nothing is ever
# fetched back from GitHub.
sync:mirror-to-github:
  stage: sync
  image: $ALPINE_IMAGE
  needs: []
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $MIRROR_TO_GITHUB == "true" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "preview" || $CI_COMMIT_BRANCH == "main")'
      variables:
        MIRROR_REF: refs/heads/$CI_COMMIT_BRANCH
    - if: '$CI_PIPELINE_SOURCE == "push" && $MIRROR_TO_GITHUB == "true" && $CI_COMMIT_TAG =~ /^v[0-9]/'
      variables:
        MIRROR_REF: refs/tags/$CI_COMMIT_TAG
  variables:
    GIT_DEPTH: 0
  # The job only pushes; the cache holds nothing it needs.
  cache: []
  script:
    - apk add --no-cache git openssh-client curl jq >/dev/null
    - test -n "$GITHUB_MIRROR_SSH_KEY" || { echo "GITHUB_MIRROR_SSH_KEY is not set -- is ${CI_COMMIT_TAG:-$CI_COMMIT_BRANCH} protected?"; exit 1; }
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # GitLab's variable editor trims the key's final newline and OpenSSH
    # refuses a key without one; put it back, and prove the key loads
    # before trying GitHub -- without printing any of it.
    - tr -d '\r' < "$GITHUB_MIRROR_SSH_KEY" > ~/.ssh/mirror_key && chmod 600 ~/.ssh/mirror_key
    - '[ -n "$(tail -c1 ~/.ssh/mirror_key)" ] && echo >> ~/.ssh/mirror_key || true'
    - 'head -1 ~/.ssh/mirror_key | grep -q "PRIVATE KEY" || { echo "GITHUB_MIRROR_SSH_KEY does not begin with a PRIVATE KEY header"; exit 1; }'
    - 'ssh-keygen -y -f ~/.ssh/mirror_key > /dev/null || { echo "GITHUB_MIRROR_SSH_KEY is not a readable private key"; exit 1; }'
    - curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com \(.)"' > ~/.ssh/known_hosts
    - test -s ~/.ssh/known_hosts
    - export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
    - git remote add github git@github.com:tomlawesome/gauntlet.git 2>/dev/null || git remote set-url github git@github.com:tomlawesome/gauntlet.git
    # Push the ref by name, not HEAD. The runner checks out a detached
    # commit, and a release tag is an annotated object pointing at one:
    # `HEAD:refs/tags/v0.1.0` would land on GitHub as a bare tag with the
    # release note gone. Fetch the ref first so it exists locally.
    - git fetch --no-tags origin "+$MIRROR_REF:$MIRROR_REF"
    - git push github "$MIRROR_REF:$MIRROR_REF"
